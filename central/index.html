<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>dropSFX · Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080b;--card:#101015;--card2:#16161d;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
    --ink:#f2f2f7;--ink-2:#a8adba;--muted:#6a6f7d;--dim:#494e5a;
    --accent:#3b6ef5;--accent-hi:#6e9bff;--accent-soft:rgba(59,110,245,.12);
    --green:#4ade80;--green-soft:rgba(74,222,128,.12);
    --orange:#ffc46b;--orange-soft:rgba(255,196,107,.12);
    --red:#f87171;--red-soft:rgba(248,113,113,.12);
    --purple:#a78bfa;--purple-soft:rgba(167,139,250,.12);
    --font:'Sora',-apple-system,BlinkMacSystemFont,sans-serif;--mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased;}

  #gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px;}
  #gate.hide{display:none;}
  .gate-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line-2);border-radius:18px;padding:34px 30px;text-align:center;}
  .gate-logo{font-weight:800;font-size:20px;letter-spacing:-.4px;margin-bottom:4px;}
  .gate-logo span{color:var(--accent-hi);}
  .gate-sub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:26px;}
  .gate-card input[type=password]{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;color:var(--ink);font-family:var(--mono);font-size:13px;margin-bottom:12px;}
  .gate-card input:focus{outline:none;border-color:var(--accent);}
  .gate-remember{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:16px;}
  .gate-remember input{accent-color:var(--accent);width:14px;height:14px;}
  .gate-remember label{font-size:12px;color:var(--ink-2);cursor:pointer;user-select:none;}
  .gate-card button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-family:var(--font);font-weight:700;font-size:14px;cursor:pointer;transition:.2s;}
  .gate-card button:hover{background:#2554d6;}
  .gate-err{color:var(--red);font-size:12.5px;margin-top:12px;min-height:16px;}

  #app{display:none;max-width:1320px;margin:0 auto;padding:24px 20px 60px;}
  #app.show{display:block;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
  .topbar h1{font-size:20px;font-weight:800;letter-spacing:-.3px;}
  .topbar h1 span{color:var(--accent-hi);}
  .topbar .actions{display:flex;gap:8px;align-items:center;}
  .btn{background:rgba(255,255,255,.05);border:1px solid var(--line-2);color:var(--ink-2);border-radius:9px;padding:8px 14px;font-family:var(--font);font-size:12.5px;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:7px;}
  .btn:hover{color:var(--ink);border-color:var(--accent);}
  .btn svg{width:14px;height:14px;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:#2554d6;color:#fff;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;}
  .stat::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--c,var(--accent));}
  .stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .stat .v{font-size:28px;font-weight:800;line-height:1;letter-spacing:-.5px;}
  .stat .sub{font-size:11px;color:var(--dim);margin-top:5px;}

  .grant-box{
    background:linear-gradient(135deg,rgba(59,110,245,.1),rgba(59,110,245,.02));
    border:1px solid rgba(59,110,245,.25);border-radius:14px;
    padding:16px 18px;margin-bottom:22px;
  }
  .grant-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .grant-head svg{width:16px;height:16px;color:var(--accent-hi);}
  .grant-head span{font-size:13px;font-weight:700;}
  .grant-row{display:flex;gap:8px;flex-wrap:wrap;}
  .grant-row input{
    flex:1;min-width:180px;background:rgba(255,255,255,.05);border:1px solid var(--line-2);
    border-radius:9px;padding:10px 13px;color:var(--ink);font-family:var(--font);font-size:13px;
  }
  .grant-row input:focus{outline:none;border-color:var(--accent);}
  .grant-msg{font-size:11.5px;margin-top:9px;min-height:15px;}
  .grant-msg.ok{color:var(--green);}
  .grant-msg.err{color:var(--red);}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .search-wrap{flex:1;min-width:200px;position:relative;}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);}
  .search-wrap input{width:100%;background:var(--card);border:1px solid var(--line-2);border-radius:9px;padding:9px 12px 9px 34px;color:var(--ink);font-family:var(--font);font-size:13px;}
  .search-wrap input:focus{outline:none;border-color:var(--accent);}
  .fchip{background:var(--card);border:1px solid var(--line-2);color:var(--ink-2);border-radius:100px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;}
  .fchip:hover{color:var(--ink);}
  .fchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-hi);}

  .table-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:1040px;}
  th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card2);cursor:pointer;user-select:none;}
  th:hover{color:var(--ink-2);}
  th .arrow{opacity:.4;margin-left:3px;font-size:9px;}
  td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-2);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(255,255,255,.02);}
  .who-cell{display:flex;flex-direction:column;gap:2px;}
  .who-name{color:var(--ink);font-weight:600;font-size:12.5px;}
  .who-email{color:var(--muted);font-family:var(--mono);font-size:10.5px;}
  .who-phone{display:inline-flex;align-items:center;gap:4px;color:#25d366;font-size:10.5px;font-weight:600;text-decoration:none;margin-top:2px;}
  .who-phone:hover{text-decoration:underline;}
  .who-phone svg{width:11px;height:11px;flex-shrink:0;}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:100px;white-space:nowrap;}
  .tag .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .tag.trial_ativo{background:var(--orange-soft);color:var(--orange);}
  .tag.trial_expirado{background:var(--red-soft);color:var(--red);}
  .tag.converteu{background:var(--green-soft);color:var(--green);}
  .tag.comprador_direto{background:var(--accent-soft);color:var(--accent-hi);}
  .tag.sem_atividade{background:rgba(255,255,255,.05);color:var(--muted);}
  .tag-manual{font-size:9px;color:var(--purple);background:var(--purple-soft);padding:2px 7px;border-radius:100px;margin-left:5px;}
  .date-cell{font-family:var(--mono);font-size:11px;color:var(--ink-2);}
  .date-cell .rel{color:var(--dim);font-size:9.5px;display:block;margin-top:1px;}
  .empty-dash{color:var(--dim);}
  .count-line{font-size:12px;color:var(--muted);margin-top:14px;font-family:var(--mono);}
  .comm-cell{font-size:11.5px;}
  .comm-cell b{color:var(--ink);}
  .comm-cell .no-user{color:var(--dim);}

  .row-actions{display:flex;gap:5px;}
  .rbtn{
    background:rgba(255,255,255,.05);border:1px solid var(--line-2);color:var(--ink-2);
    border-radius:7px;padding:5px 9px;font-size:10.5px;font-weight:600;cursor:pointer;
    font-family:var(--font);transition:.15s;white-space:nowrap;
  }
  .rbtn:hover{color:var(--ink);}
  .rbtn.grant{color:var(--green);border-color:rgba(74,222,128,.3);}
  .rbtn.grant:hover{background:var(--green-soft);}
  .rbtn.revoke{color:var(--red);border-color:rgba(248,113,113,.3);}
  .rbtn.revoke:hover{background:var(--red-soft);}

  .loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px;}
  .spinner{width:32px;height:32px;border:3px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--card2);border:1px solid var(--line-2);border-radius:10px;
    padding:11px 18px;font-size:12.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0;visibility:hidden;transition:.25s;z-index:200;
  }
  #toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}
  #toast.ok{border-color:rgba(74,222,128,.4);color:var(--green);}
  #toast.err{border-color:rgba(248,113,113,.4);color:var(--red);}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="gate-logo">drop<span>SFX</span></div>
    <div class="gate-sub">Central privada</div>
    <input type="password" id="gate-pass" placeholder="Senha de acesso" autocomplete="current-password"/>
    <div class="gate-remember">
      <input type="checkbox" id="gate-remember-check" checked>
      <label for="gate-remember-check">Lembrar minha senha neste navegador</label>
    </div>
    <button id="gate-btn">Entrar</button>
    <div class="gate-err" id="gate-err"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <h1>drop<span>SFX</span> · Central de controle</h1>
    <div class="actions">
      <button class="btn" id="btn-refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        Atualizar
      </button>
      <button class="btn" id="btn-export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Exportar CSV
      </button>
      <button class="btn" id="btn-logout">Sair</button>
    </div>
  </div>

  <div id="content">
    <div class="loading"><div class="spinner"></div>Carregando dados…</div>
  </div>
</div>

<div id="toast"></div>

<script>
  var ADMIN_ENDPOINT = 'https://bwgrxdjdvrdawarbnqjv.supabase.co/functions/v1/admin-users';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3Z3J4ZGpkdnJkYXdhcmJucWp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMjIxNDgsImV4cCI6MjA5NDU5ODE0OH0.M1Yw6ljgUzPQWTW0CC8DBn8WV6nZDKCCKTwzcZN_Zo0';

  var CAT_LABELS = {
    trial_ativo:      'Trial ativo',
    trial_expirado:   'Trial expirado',
    converteu:        'Converteu',
    comprador_direto: 'Comprou direto',
    sem_atividade:    'Sem atividade'
  };

  var state = { users: [], summary: {}, filter: 'all', search: '', sortKey: 'last_sign_in', sortDir: -1, token: '' };

  var gate = document.getElementById('gate');
  var gateErr = document.getElementById('gate-err');
  var gatePass = document.getElementById('gate-pass');
  var gateRemember = document.getElementById('gate-remember-check');

  document.getElementById('gate-btn').addEventListener('click', tryLogin);
  gatePass.addEventListener('keydown', function(e){ if(e.key==='Enter') tryLogin(); });

  var savedPass = localStorage.getItem('dropsfx_admin_saved_pass');
  var savedSession = sessionStorage.getItem('dropsfx_admin_token');

  if (savedSession) {
    state.token = savedSession;
    enterApp();
  } else if (savedPass) {
    gatePass.value = savedPass;
    tryLogin();
  }

  function tryLogin(){
    var pass = gatePass.value.trim();
    if(!pass){ gateErr.textContent = 'Digite a senha.'; return; }
    gateErr.textContent = '';
    state.token = pass;
    apiCall({ action: 'list' }, function(ok, data, status){
      if(ok){
        sessionStorage.setItem('dropsfx_admin_token', pass);
        if (gateRemember.checked) {
          localStorage.setItem('dropsfx_admin_saved_pass', pass);
        } else {
          localStorage.removeItem('dropsfx_admin_saved_pass');
        }
        state.users = data.users || [];
        state.summary = data.summary || {};
        enterApp();
      } else {
        gateErr.textContent = status === 401 ? 'Senha incorreta.' : 'Erro ao conectar. Tenta de novo.';
      }
    });
  }

  function enterApp(){
    gate.classList.add('hide');
    document.getElementById('app').classList.add('show');
    if (state.users.length) {
      render();
    } else {
      load();
    }
  }

  document.getElementById('btn-logout').addEventListener('click', function(){
    sessionStorage.removeItem('dropsfx_admin_token');
    location.reload();
  });
  document.getElementById('btn-refresh').addEventListener('click', function(){ load(); });
  document.getElementById('btn-export').addEventListener('click', exportCSV);

  function apiCall(payload, cb){
    fetch(ADMIN_ENDPOINT, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'x-admin-token': state.token
      },
      body: JSON.stringify(payload)
    })
    .then(function(r){ return r.json().then(function(data){ cb(r.ok, data, r.status); }); })
    .catch(function(){ cb(false, {}, 0); });
  }

  function load(){
    var content = document.getElementById('content');
    content.innerHTML = '<div class="loading"><div class="spinner"></div>Carregando dados…</div>';
    apiCall({ action: 'list' }, function(ok, data){
      if(!ok){
        content.innerHTML = '<div class="loading">Erro ao carregar. <a href="#" onclick="location.reload()" style="color:var(--accent-hi)">Recarregar</a></div>';
        return;
      }
      state.users = data.users || [];
      state.summary = data.summary || {};
      render();
    });
  }

  function showToast(msg, kind){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show ' + (kind||'');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 3200);
  }

  function fmtDate(iso){
    if(!iso) return null;
    var d = new Date(iso);
    var dd = String(d.getDate()).padStart(2,'0');
    var mm = String(d.getMonth()+1).padStart(2,'0');
    var yy = d.getFullYear();
    var hh = String(d.getHours()).padStart(2,'0');
    var mi = String(d.getMinutes()).padStart(2,'0');
    return dd+'/'+mm+'/'+yy+' '+hh+':'+mi;
  }
  function relTime(iso){
    if(!iso) return '';
    var diff = Date.now() - new Date(iso).getTime();
    var day = 86400000;
    if(diff < day) return 'hoje';
    var days = Math.floor(diff/day);
    if(days === 1) return 'ontem';
    if(days < 30) return 'há '+days+' dias';
    var months = Math.floor(days/30);
    if(months < 12) return 'há '+months+' '+(months===1?'mês':'meses');
    return 'há '+Math.floor(months/12)+' ano(s)';
  }

  function render(){
    var s = state.summary;
    var cards =
      card('Total de contas', s.total||0, 'var(--muted)', '') +
      card('Trial ativo', s.trial_ativo||0, 'var(--orange)', 'testando agora') +
      card('Converteram', s.converteu||0, 'var(--green)', 'trial → compra') +
      card('Taxa de conversão', (s.taxa_conversao||0)+'%', 'var(--accent-hi)', 'dos que testaram') +
      card('Trial expirado', s.trial_expirado||0, 'var(--red)', 'sem comprar') +
      card('Compraram direto', s.comprador_direto||0, 'var(--accent)', 'sem passar por trial');

    var chips = ['all','trial_ativo','converteu','trial_expirado','comprador_direto','sem_atividade'].map(function(c){
      var label = c==='all' ? 'Todos' : CAT_LABELS[c];
      var n = c==='all' ? state.users.length : (state.users.filter(function(u){return u.category===c;}).length);
      return '<div class="fchip '+(state.filter===c?'on':'')+'" data-f="'+c+'">'+label+' ('+n+')</div>';
    }).join('');

    var rows = filteredSorted();

    var html =
      '<div class="cards">'+cards+'</div>'+

      '<div class="grant-box">'+
        '<div class="grant-head">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>'+
          '<span>Liberar acesso vitalício pra qualquer e-mail</span>'+
        '</div>'+
        '<div class="grant-row">'+
          '<input type="email" id="grant-email" placeholder="email@exemplo.com">'+
          '<input type="text" id="grant-name" placeholder="Nome (opcional)">'+
          '<button class="btn btn-primary" id="grant-btn">Liberar</button>'+
        '</div>'+
        '<div class="grant-msg" id="grant-msg"></div>'+
      '</div>'+

      '<div class="filters">'+
        '<div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>'+
        '<input type="text" id="search" placeholder="Buscar por e-mail ou nome…" value="'+escapeAttr(state.search)+'"/></div>'+
        chips+
      '</div>'+
      '<div class="table-wrap"><div class="table-scroll"><table>'+
        '<thead><tr>'+
          th('Cliente','email')+
          th('Categoria','category')+
          th('Comunidade','community_posts')+
          th('Trial iniciado','trial_started')+
          th('Comprou em','purchased_at')+
          th('Último login','last_sign_in')+
          '<th>Ações</th>'+
        '</tr></thead><tbody>'+
        (rows.length ? rows.map(rowHtml).join('') : '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--dim)">Nenhum resultado</td></tr>')+
        '</tbody></table></div></div>'+
      '<div class="count-line">'+rows.length+' de '+state.users.length+' contas</div>';

    document.getElementById('content').innerHTML = html;

    document.getElementById('search').addEventListener('input', function(e){
      state.search = e.target.value; renderTableOnly();
    });
    document.querySelectorAll('.fchip').forEach(function(ch){
      ch.addEventListener('click', function(){ state.filter = ch.dataset.f; render(); });
    });
    document.querySelectorAll('th[data-sort]').forEach(function(h){
      h.addEventListener('click', function(){
        var k = h.dataset.sort;
        if(state.sortKey===k){ state.sortDir *= -1; } else { state.sortKey=k; state.sortDir=-1; }
        render();
      });
    });
    document.getElementById('grant-btn').addEventListener('click', function(){
      doGrant(document.getElementById('grant-email').value, document.getElementById('grant-name').value);
    });
    document.getElementById('grant-email').addEventListener('keydown', function(e){
      if(e.key==='Enter') doGrant(this.value, document.getElementById('grant-name').value);
    });
    bindRowActions();
  }

  function renderTableOnly(){
    var rows = filteredSorted();
    var tbody = document.querySelector('tbody');
    if(tbody) tbody.innerHTML = rows.length ? rows.map(rowHtml).join('') : '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--dim)">Nenhum resultado</td></tr>';
    var cl = document.querySelector('.count-line');
    if(cl) cl.textContent = rows.length+' de '+state.users.length+' contas';
    bindRowActions();
  }

  function bindRowActions(){
    document.querySelectorAll('.rbtn.grant').forEach(function(b){
      b.addEventListener('click', function(){ doGrant(b.dataset.email, ''); });
    });
    document.querySelectorAll('.rbtn.revoke').forEach(function(b){
      b.addEventListener('click', function(){ doRevoke(b.dataset.email); });
    });
  }

  function doGrant(email, name){
    email = (email||'').trim().toLowerCase();
    if(!email || email.indexOf('@')===-1){
      var msg = document.getElementById('grant-msg');
      if(msg){ msg.textContent = 'Digita um e-mail válido.'; msg.className='grant-msg err'; }
      return;
    }
    apiCall({ action:'grant_license', email: email, buyer_name: name||'' }, function(ok, data){
      var msg = document.getElementById('grant-msg');
      if(ok){
        if(msg){ msg.textContent = '✓ '+email+' liberado com acesso vitalício.'; msg.className='grant-msg ok'; }
        showToast(email + ' liberado!', 'ok');
        document.getElementById('grant-email').value = '';
        document.getElementById('grant-name').value = '';
        load();
      } else {
        if(msg){ msg.textContent = 'Erro: '+(data.error||'falha ao liberar'); msg.className='grant-msg err'; }
        showToast('Erro ao liberar', 'err');
      }
    });
  }

  function doRevoke(email){
    if(!confirm('Revogar o acesso de '+email+'? Isso bloqueia o plugin pra essa conta.')) return;
    apiCall({ action:'revoke_license', email: email }, function(ok, data){
      if(ok){ showToast('Acesso de '+email+' revogado.', 'ok'); load(); }
      else { showToast('Erro ao revogar', 'err'); }
    });
  }

  function waLink(phone){
    var digits = (phone||'').replace(/[^0-9]/g,'');
    if(!digits) return '';
    return '<a class="who-phone" href="https://wa.me/'+digits+'" target="_blank" rel="noopener">'+
      '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.13.3-.35.44-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.07c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2-1.41.25-.7.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35"/><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.38 5.07L2 22l5.05-1.32A9.94 9.94 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>'+
      phone+'</a>';
  }

  function card(k,v,color,sub){
    return '<div class="stat" style="--c:'+color+'"><div class="k">'+k+'</div><div class="v">'+v+'</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>';
  }
  function th(label,key){
    var arrow = state.sortKey===key ? '<span class="arrow">'+(state.sortDir>0?'▲':'▼')+'</span>' : '';
    return '<th data-sort="'+key+'">'+label+arrow+'</th>';
  }
  function rowHtml(u){
    var name = u.buyer_name || u.community_username || '';
    var whoHtml = '<div class="who-cell">' +
      (name ? '<span class="who-name">'+escapeHtml(name)+'</span>' : '') +
      '<span class="who-email">'+escapeHtml(u.email)+'</span>' +
      (u.phone ? waLink(u.phone) : '') +
    '</div>';

    var catTag = '<span class="tag '+u.category+'"><span class="dot"></span>'+CAT_LABELS[u.category]+'</span>' +
      (u.is_manual_grant ? '<span class="tag-manual">manual</span>' : '');

    var commHtml = u.community_username
      ? '<span class="comm-cell">@<b>'+escapeHtml(u.community_username)+'</b><br>'+u.community_posts+' posts · '+u.community_downloads+' downloads</span>'
      : '<span class="comm-cell no-user">sem perfil</span>';

    var trialStarted = u.trial_started ? '<span class="date-cell">'+fmtDate(u.trial_started)+'<span class="rel">'+relTime(u.trial_started)+'</span></span>' : '<span class="empty-dash">—</span>';
    var bought = u.purchased_at ? '<span class="date-cell">'+fmtDate(u.purchased_at)+'<span class="rel">'+relTime(u.purchased_at)+'</span></span>' : '<span class="empty-dash">—</span>';
    var lastLogin = u.last_sign_in ? '<span class="date-cell">'+fmtDate(u.last_sign_in)+'<span class="rel">'+relTime(u.last_sign_in)+'</span></span>' : '<span class="empty-dash">—</span>';

    var actions = u.purchased
      ? '<button class="rbtn revoke" data-email="'+escapeAttr(u.email)+'">Revogar</button>'
      : '<button class="rbtn grant" data-email="'+escapeAttr(u.email)+'">Liberar</button>';

    return '<tr>'+
      '<td>'+whoHtml+'</td>'+
      '<td>'+catTag+'</td>'+
      '<td>'+commHtml+'</td>'+
      '<td>'+trialStarted+'</td>'+
      '<td>'+bought+'</td>'+
      '<td>'+lastLogin+'</td>'+
      '<td><div class="row-actions">'+actions+'</div></td>'+
    '</tr>';
  }

  function filteredSorted(){
    var out = state.users.slice();
    if(state.filter !== 'all') out = out.filter(function(u){ return u.category === state.filter; });
    if(state.search.trim()){
      var q = state.search.trim().toLowerCase();
      out = out.filter(function(u){
        return (u.email||'').toLowerCase().indexOf(q) !== -1 ||
               (u.buyer_name||'').toLowerCase().indexOf(q) !== -1 ||
               (u.community_username||'').toLowerCase().indexOf(q) !== -1;
      });
    }
    var k = state.sortKey, dir = state.sortDir;
    out.sort(function(a,b){
      var va = a[k], vb = b[k];
      if(k==='email' || k==='category'){
        va = (va||'').toString(); vb = (vb||'').toString();
        return va.localeCompare(vb) * dir;
      }
      if(k==='community_posts'){
        return ((a.community_posts||0) - (b.community_posts||0)) * dir;
      }
      var ta = va ? new Date(va).getTime() : 0;
      var tb = vb ? new Date(vb).getTime() : 0;
      return (ta - tb) * dir;
    });
    return out;
  }

  function exportCSV(){
    var rows = filteredSorted();
    var head = ['email','nome','telefone','usuario_comunidade','categoria','posts_comunidade','downloads_comunidade','trial_iniciado','comprou_em','ultimo_login','conta_criada'];
    var lines = [head.join(',')];
    rows.forEach(function(u){
      lines.push([
        u.email, u.buyer_name||'', u.phone||'', u.community_username||'',
        CAT_LABELS[u.category], u.community_posts||0, u.community_downloads||0,
        u.trial_started||'', u.purchased_at||'', u.last_sign_in||'', u.account_created||''
      ].map(csvCell).join(','));
    });
    var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'dropsfx-usuarios-'+new Date().toISOString().slice(0,10)+'.csv';
    a.click(); URL.revokeObjectURL(url);
  }
  function csvCell(v){ v = (v==null?'':''+v); if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"'; return v; }

  function escapeHtml(s){ return (s||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
