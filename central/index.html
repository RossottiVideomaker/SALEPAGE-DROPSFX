<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>dropSFX · Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080b;--card:#101015;--card2:#16161d;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
    --ink:#f2f2f7;--ink-2:#a8adba;--muted:#6a6f7d;--dim:#494e5a;
    --accent:#3b6ef5;--accent-hi:#6e9bff;--accent-soft:rgba(59,110,245,.12);
    --green:#4ade80;--green-soft:rgba(74,222,128,.12);
    --orange:#ffc46b;--orange-soft:rgba(255,196,107,.12);
    --red:#f87171;--red-soft:rgba(248,113,113,.12);
    --purple:#a78bfa;--purple-soft:rgba(167,139,250,.12);
    --font:'Sora',-apple-system,BlinkMacSystemFont,sans-serif;--mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased;}

  #gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px;}
  #gate.hide{display:none;}
  .gate-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line-2);border-radius:18px;padding:34px 30px;text-align:center;}
  .gate-logo{font-weight:800;font-size:20px;letter-spacing:-.4px;margin-bottom:4px;}
  .gate-logo span{color:var(--accent-hi);}
  .gate-sub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:26px;}
  .gate-card input[type=password]{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;color:var(--ink);font-family:var(--mono);font-size:13px;margin-bottom:12px;}
  .gate-card input:focus{outline:none;border-color:var(--accent);}
  .gate-remember{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:16px;}
  .gate-remember input{accent-color:var(--accent);width:14px;height:14px;}
  .gate-remember label{font-size:12px;color:var(--ink-2);cursor:pointer;user-select:none;}
  .gate-card button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-family:var(--font);font-weight:700;font-size:14px;cursor:pointer;transition:.2s;}
  .gate-card button:hover{background:#2554d6;}
  .gate-err{color:var(--red);font-size:12.5px;margin-top:12px;min-height:16px;}

  #app{display:none;max-width:1320px;margin:0 auto;padding:24px 20px 60px;}
  #app.show{display:block;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
  .topbar h1{font-size:20px;font-weight:800;letter-spacing:-.3px;}
  .topbar h1 span{color:var(--accent-hi);}
  .topbar .actions{display:flex;gap:8px;align-items:center;}
  .btn{background:rgba(255,255,255,.05);border:1px solid var(--line-2);color:var(--ink-2);border-radius:9px;padding:8px 14px;font-family:var(--font);font-size:12.5px;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:7px;}
  .btn:hover{color:var(--ink);border-color:var(--accent);}
  .btn svg{width:14px;height:14px;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:#2554d6;color:#fff;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;}
  .stat::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--c,var(--accent));}
  .stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .stat .v{font-size:28px;font-weight:800;line-height:1;letter-spacing:-.5px;}
  .stat .sub{font-size:11px;color:var(--dim);margin-top:5px;}

  .grant-box{
    background:linear-gradient(135deg,rgba(59,110,245,.1),rgba(59,110,245,.02));
    border:1px solid rgba(59,110,245,.25);border-radius:14px;
    padding:16px 18px;margin-bottom:22px;
  }
  .grant-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .grant-head svg{width:16px;height:16px;color:var(--accent-hi);}
  .grant-head span{font-size:13px;font-weight:700;}
  .grant-row{display:flex;gap:8px;flex-wrap:wrap;}
  .grant-row input{
    flex:1;min-width:180px;background:rgba(255,255,255,.05);border:1px solid var(--line-2);
    border-radius:9px;padding:10px 13px;color:var(--ink);font-family:var(--font);font-size:13px;
  }
  .grant-row input:focus{outline:none;border-color:var(--accent);}
  .grant-msg{font-size:11.5px;margin-top:9px;min-height:15px;}
  .grant-msg.ok{color:var(--green);}
  .grant-msg.err{color:var(--red);}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .search-wrap{flex:1;min-width:200px;position:relative;}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);}
  .search-wrap input{width:100%;background:var(--card);border:1px solid var(--line-2);border-radius:9px;padding:9px 12px 9px 34px;color:var(--ink);font-family:var(--font);font-size:13px;}
  .search-wrap input:focus{outline:none;border-color:var(--accent);}
  .fchip{background:var(--card);border:1px solid var(--line-2);color:var(--ink-2);border-radius:100px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;}
  .fchip:hover{color:var(--ink);}
  .fchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-hi);}

  .table-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:1040px;}
  th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card2);cursor:pointer;user-select:none;}
  th:hover{color:var(--ink-2);}
  th .arrow{opacity:.4;margin-left:3px;font-size:9px;}
  td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-2);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(255,255,255,.02);}
  .who-cell{display:flex;flex-direction:column;gap:2px;}
  .who-name{color:var(--ink);font-weight:600;font-size:12.5px;}
  .who-email{color:var(--muted);font-family:var(--mono);font-size:10.5px;}
  .who-phone{display:inline-flex;align-items:center;gap:4px;color:#25d366;font-size:10.5px;font-weight:600;text-decoration:none;margin-top:2px;}
  .who-phone:hover{text-decoration:underline;}
  .who-phone svg{width:11px;height:11px;flex-shrink:0;}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:100px;white-space:nowrap;}
  .tag .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .tag.trial_ativo{background:var(--orange-soft);color:var(--orange);}
  .tag.trial_expirado{background:var(--red-soft);color:var(--red);}
  .tag.converteu{background:var(--green-soft);color:var(--green);}
  .tag.comprador_direto{background:var(--accent-soft);color:var(--accent-hi);}
  .tag.sem_atividade{background:rgba(255,255,255,.05);color:var(--muted);}
  .tag-manual{font-size:9px;color:var(--purple);background:var(--purple-soft);padding:2px 7px;border-radius:100px;margin-left:5px;}
  .date-cell{font-family:var(--mono);font-size:11px;color:var(--ink-2);}
  .date-cell .rel{color:var(--dim);font-size:9.5px;display:block;margin-top:1px;}
  .empty-dash{color:var(--dim);}
  .count-line{font-size:12px;color:var(--muted);margin-top:14px;font-family:var(--mono);}
  .comm-cell{font-size:11.5px;}
  .comm-cell b{color:var(--ink);}
  .comm-cell .no-user{color:var(--dim);}

  .row-actions{display:flex;gap:5px;}
  .rbtn{
    background:rgba(255,255,255,.05);border:1px solid var(--line-2);color:var(--ink-2);
    border-radius:7px;padding:5px 9px;font-size:10.5px;font-weight:600;cursor:pointer;
    font-family:var(--font);transition:.15s;white-space:nowrap;
  }
  .rbtn:hover{color:var(--ink);}
  .rbtn.grant{color:var(--green);border-color:rgba(74,222,128,.3);}
  .rbtn.grant:hover{background:var(--green-soft);}
  .rbtn.revoke{color:var(--red);border-color:rgba(248,113,113,.3);}
  .rbtn.revoke:hover{background:var(--red-soft);}

  .loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px;}
  .spinner{width:32px;height:32px;border:3px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--card2);border:1px solid var(--line-2);border-radius:10px;
    padding:11px 18px;font-size:12.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0;visibility:hidden;transition:.25s;z-index:200;
  }
  #toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}
  #toast.ok{border-color:rgba(74,222,128,.4);color:var(--green);}
  #toast.err{border-color:rgba(248,113,113,.4);color:var(--red);}
  /* ===== abas ===== */
  .tabs{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:11px;}
  .tab{background:none;border:0;color:var(--muted);font-family:var(--font);font-size:13px;font-weight:700;padding:8px 16px;border-radius:8px;cursor:pointer;}
  .tab:hover{color:var(--ink);}
  .tab.on{background:var(--accent);color:#fff;}

  /* ===== funil ===== */
  .fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
  .fbar .sep{width:1px;height:22px;background:var(--line-2);margin:0 4px;}
  .fbar .hint{font-size:11.5px;color:var(--dim);margin-left:auto;font-family:var(--mono);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px;}
  .span2{grid-column:span 2;}
  @media(max-width:1000px){.grid2,.grid3{grid-template-columns:1fr;}.span2{grid-column:auto;}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;min-width:0;}
  .grid2 .panel,.grid3 .panel{margin-bottom:0;}
  .panel h3{font-size:13px;font-weight:700;margin-bottom:4px;}
  .panel .ph{font-size:11.5px;color:var(--muted);margin-bottom:14px;}
  .fstep{display:grid;grid-template-columns:190px 1fr 120px;gap:12px;align-items:center;padding:6px 0;}
  .fstep .lbl{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fstep .lbl small{display:block;color:var(--dim);font-size:10.5px;}
  .fstep .track{height:22px;background:rgba(255,255,255,.04);border-radius:6px;overflow:hidden;position:relative;}
  .fstep .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hi));border-radius:6px;min-width:2px;}
  .fstep.buy .fill{background:linear-gradient(90deg,#16a34a,var(--green));}
  .fstep .track b{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11.5px;font-family:var(--mono);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .fstep .pct{font-family:var(--mono);font-size:11px;text-align:right;color:var(--ink-2);}
  .fstep .pct .drop{display:block;color:var(--red);font-size:10px;}
  .fstep.worst .lbl{color:var(--red);}
  .fstep.worst .track{outline:1px solid rgba(248,113,113,.5);}
  @media(max-width:700px){.fstep{grid-template-columns:110px 1fr 70px;}}
  .ans h4{font-size:12px;font-weight:700;margin:14px 0 8px;color:var(--ink);}
  .ans h4:first-child{margin-top:0;}
  .arow{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:11.5px;color:var(--ink-2);padding:3px 0;}
  .arow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .arow .b{height:10px;border-radius:5px;background:rgba(255,255,255,.05);overflow:hidden;}
  .arow .b i{display:block;height:100%;background:var(--purple);border-radius:5px;}
  .arow .n{font-family:var(--mono);text-align:right;}
  .mini{width:100%;border-collapse:collapse;min-width:0;}
  .mini th{position:static;background:none;padding:6px 6px;font-size:9.5px;cursor:default;border-bottom:1px solid var(--line);}
  .mini td{padding:6px 6px;font-size:11.5px;border-bottom:1px solid var(--line);white-space:nowrap;}
  .mini td.k{max-width:160px;overflow:hidden;text-overflow:ellipsis;color:var(--ink);}
  .mini td.num{font-family:var(--mono);text-align:right;}
  .mini th.num{text-align:right;}
  .chart{width:100%;height:200px;display:block;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--muted);}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
  .kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:12px;}
  .kv span:nth-child(odd){color:var(--muted);}
  .kv span:nth-child(even){font-family:var(--mono);color:var(--ink);text-align:right;}
  .sess-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;background:rgba(255,255,255,.06);color:var(--muted);}
  .sess-tag.buy{background:var(--green-soft);color:var(--green);}
  .sess-tag.cta{background:var(--orange-soft);color:var(--orange);}
  .sess-tag.res{background:var(--accent-soft);color:var(--accent-hi);}
  .sess-tag.qz{background:var(--purple-soft);color:var(--purple);}
  .ans-cell{font-size:10.5px;color:var(--muted);white-space:normal;min-width:240px;line-height:1.45;}
  .cmp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .cmp div{background:rgba(255,255,255,.03);border-radius:10px;padding:10px 12px;}
  .cmp b{display:block;font-size:20px;font-weight:800;}
  .cmp span{font-size:10.5px;color:var(--muted);}
  .empty-note{padding:30px;text-align:center;color:var(--dim);font-size:12.5px;}

  /* ===== feedback ===== */
  .fb-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.05);margin-bottom:10px;}
  .fb-bar i{display:block;height:100%;}
  .fb-quote{border-top:1px solid var(--line);padding:12px 0;}
  .fb-quote:first-of-type{border-top:0;padding-top:0;}
  .fb-quote p{font-size:13px;color:var(--ink);margin-top:5px;white-space:pre-wrap;}
  .fb-quote .meta{font-size:11px;color:var(--muted);}
  .fb-prints{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .fb-print{display:flex;flex-direction:column;gap:8px;}
  .fb-print canvas{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);}
  .fb-opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .fb-opts label{font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
  .fb-opts input{accent-color:var(--accent);}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="gate-logo">drop<span>SFX</span></div>
    <div class="gate-sub">Central privada</div>
    <input type="password" id="gate-pass" placeholder="Senha de acesso" autocomplete="current-password"/>
    <div class="gate-remember">
      <input type="checkbox" id="gate-remember-check" checked>
      <label for="gate-remember-check">Lembrar minha senha neste navegador</label>
    </div>
    <button id="gate-btn">Entrar</button>
    <div class="gate-err" id="gate-err"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <h1>drop<span>SFX</span> · Central de controle</h1>
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="clientes" role="tab">Clientes</button>
      <button class="tab" data-tab="funil" role="tab">Funil e métricas</button>
      <button class="tab" data-tab="feedback" role="tab">Feedback</button>
    </div>
    <div class="actions">
      <button class="btn" id="btn-refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        Atualizar
      </button>
      <button class="btn" id="btn-export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Exportar CSV
      </button>
      <button class="btn" id="btn-logout">Sair</button>
    </div>
  </div>

  <div id="content">
    <div class="loading"><div class="spinner"></div>Carregando dados…</div>
  </div>
</div>

<div id="toast"></div>

<script>
  var ADMIN_ENDPOINT = 'https://bwgrxdjdvrdawarbnqjv.supabase.co/functions/v1/admin-users';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3Z3J4ZGpkdnJkYXdhcmJucWp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMjIxNDgsImV4cCI6MjA5NDU5ODE0OH0.M1Yw6ljgUzPQWTW0CC8DBn8WV6nZDKCCKTwzcZN_Zo0';

  var CAT_LABELS = {
    trial_ativo:      'Trial ativo',
    trial_expirado:   'Trial expirado',
    converteu:        'Converteu',
    comprador_direto: 'Comprou direto',
    sem_atividade:    'Sem atividade'
  };

  var state = { users: [], summary: {}, filter: 'all', search: '', sortKey: 'last_sign_in', sortDir: -1, token: '', tab: 'clientes' };
  try { var savedTab = localStorage.getItem('dropsfx_central_tab'); if (savedTab === 'funil' || savedTab === 'feedback') state.tab = savedTab; } catch(e){}

  var gate = document.getElementById('gate');
  var gateErr = document.getElementById('gate-err');
  var gatePass = document.getElementById('gate-pass');
  var gateRemember = document.getElementById('gate-remember-check');

  document.getElementById('gate-btn').addEventListener('click', tryLogin);
  gatePass.addEventListener('keydown', function(e){ if(e.key==='Enter') tryLogin(); });

  var savedPass = localStorage.getItem('dropsfx_admin_saved_pass');
  var savedSession = sessionStorage.getItem('dropsfx_admin_token');

  // espera o script inteiro carregar (a aba Funil é definida mais abaixo)
  setTimeout(function(){
    if (savedSession) {
      state.token = savedSession;
      enterApp();
    } else if (savedPass) {
      gatePass.value = savedPass;
      tryLogin();
    }
  }, 0);

  function tryLogin(){
    var pass = gatePass.value.trim();
    if(!pass){ gateErr.textContent = 'Digite a senha.'; return; }
    gateErr.textContent = '';
    state.token = pass;
    apiCall({ action: 'list' }, function(ok, data, status){
      if(ok){
        sessionStorage.setItem('dropsfx_admin_token', pass);
        if (gateRemember.checked) {
          localStorage.setItem('dropsfx_admin_saved_pass', pass);
        } else {
          localStorage.removeItem('dropsfx_admin_saved_pass');
        }
        state.users = data.users || [];
        state.summary = data.summary || {};
        enterApp();
      } else {
        gateErr.textContent = status === 401 ? 'Senha incorreta.' : 'Erro ao conectar. Tenta de novo.';
      }
    });
  }

  function setTab(tab){
    state.tab = tab;
    try { localStorage.setItem('dropsfx_central_tab', tab); } catch(e){}
    document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === tab); });
    if (tab === 'funil') loadFunnel();
    else if (tab === 'feedback') loadFeedback();
    else if (state.users.length) render(); else load();

  function fmtDate(iso){
    if(!iso) return null;
    var d = new Date(iso);
    var dd = String(d.getDate()).padStart(2,'0');
    var mm = String(d.getMonth()+1).padStart(2,'0');
    var yy = d.getFullYear();
    var hh = String(d.getHours()).padStart(2,'0');
    var mi = String(d.getMinutes()).padStart(2,'0');
    return dd+'/'+mm+'/'+yy+' '+hh+':'+mi;
  }
  function relTime(iso){
    if(!iso) return '';
    var diff = Date.now() - new Date(iso).getTime();
    var day = 86400000;
    if(diff < day) return 'hoje';
    var days = Math.floor(diff/day);
    if(days === 1) return 'ontem';
    if(days < 30) return 'há '+days+' dias';
    var months = Math.floor(days/30);
    if(months < 12) return 'há '+months+' '+(months===1?'mês':'meses');
    return 'há '+Math.floor(months/12)+' ano(s)';
  }

  function filteredSorted(){
    var out = state.users.slice();
    if(state.filter !== 'all') out = out.filter(function(u){ return u.category === state.filter; });
    if(state.search.trim()){
      var q = state.search.trim().toLowerCase();
      out = out.filter(function(u){
        return (u.email||'').toLowerCase().indexOf(q) !== -1 ||
               (u.buyer_name||'').toLowerCase().indexOf(q) !== -1 ||
               (u.community_username||'').toLowerCase().indexOf(q) !== -1;
      });
    }
    var k = state.sortKey, dir = state.sortDir;
    out.sort(function(a,b){
      var va = a[k], vb = b[k];
      if(k==='email' || k==='category'){
        va = (va||'').toString(); vb = (vb||'').toString();
        return va.localeCompare(vb) * dir;
      }
      if(k==='community_posts'){
        return ((a.community_posts||0) - (b.community_posts||0)) * dir;
      }
      var ta = va ? new Date(va).getTime() : 0;
      var tb = vb ? new Date(vb).getTime() : 0;
      return (ta - tb) * dir;
    });
    return out;
  }

      '</div>';
    } else {
      cards = '<div class="cards">' +
        card('Sessões', base, 'var(--accent)', (T.visitors||0) + ' visitantes, ' + (T.returning_visitors||0) + ' voltaram') +

        (isAll ? '' : card('Chegaram no preço', sc.oferta || 0, 'var(--accent-hi)', pct(sc.oferta, base) + '% das sessões')) +
        card('Clicaram em comprar', T.cta_sessions || 0, 'var(--orange)', pct(T.cta_sessions, base) + '% das sessões, ' + (T.cta_clicks||0) + ' cliques') +

    // ---- funil passo a passo ----
    var steps;

        steps.push([Q_LABEL[q] + ' <span style="color:var(--dim);font-weight:400">' + Q_PHASE[q] + '</span>', Qs[q] || 0, 'q']);
        if (q === 'vol') steps.push(['Viram o número bloqueado', T.mid_views || 0]);

    }
    var worst = -1, worstDrop = 0;
    steps.forEach(function(s, i){ if (i > 1 && steps[i-1][1] > 0 && s[2] !== 'buy') { var dr = 1 - (s[1]||0) / steps[i-1][1]; if (dr > worstDrop) { worstDrop = dr; worst = i; } } });
    var maxv = Math.max(1, steps[0][1] || 0);
    var funnelHtml = steps.map(function(s, i){
      var v = s[1] || 0, prev = i ? (steps[i-1][1] || 0) : v;
      var drop = i && prev ? Math.round((1 - v / prev) * 100) : 0;
      return '<div class="fstep' + (s[2]==='buy' ? ' buy' : '') + (i === worst && worstDrop > 0 ? ' worst' : '') + '">' +
        '<div class="lbl">' + s[0] + (i === worst && worstDrop > 0 ? '<small>maior abandono</small>' : '') + '</div>' +
        '<div class="track"><div class="fill" style="width:' + Math.max(0.5, v / maxv * 100) + '%"></div><b>' + v + '</b></div>' +
        '<div class="pct">' + pct(v, steps[0][1]) + '%' + (i && drop > 0 ? '<span class="drop">−' + drop + '% vs anterior</span>' : '') + '</div>' +
      '</div>';

    // ---- dimensões ----

        rows = Object.keys(m).map(function(k){ return m[k]; }).sort(function(a,b){ return b.sessions - a.sessions; });

    // ---- gráfico por dia ----
    function dailyChart(){
      var rows = d.daily || [];
      if (!rows.length) return '<div class="empty-note">Sem dados no período</div>';
      var W = 900, H = 200, P = 26, n = rows.length;
      var maxY = Math.max(1, Math.max.apply(null, rows.map(function(r){ return r.sessions; })));
      var bw = (W - P * 2) / n;
      var x = function(i){ return P + i * bw + bw / 2; }, y = function(v){ return H - P - (v / maxY) * (H - P * 2); };
      var line = function(key){ return rows.map(function(r,i){ return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(r[key]).toFixed(1); }).join(' '); };
      var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
      [0, .5, 1].forEach(function(g){ var yy = y(maxY * g); svg += '<line x1="' + P + '" x2="' + (W - P) + '" y1="' + yy + '" y2="' + yy + '" stroke="rgba(255,255,255,.06)"/><text x="2" y="' + (yy + 4) + '" fill="#6a6f7d" font-size="10" font-family="JetBrains Mono">' + Math.round(maxY * g) + '</text>'; });
      rows.forEach(function(r,i){ svg += '<rect x="' + (x(i) - bw * .32) + '" y="' + y(r.sessions) + '" width="' + (bw * .64) + '" height="' + (H - P - y(r.sessions)) + '" rx="3" fill="rgba(59,110,245,.35)"><title>' + r.d + ': ' + r.sessions + ' sessões</title></rect>'; });
      if (isQuiz) svg += '<path d="' + line('completes') + '" fill="none" stroke="#a78bfa" stroke-width="2"/>';
      else svg += '<path d="' + line('clicks') + '" fill="none" stroke="#ffc46b" stroke-width="2"/>';
      rows.forEach(function(r,i){ if (r.purchases_all) svg += '<circle cx="' + x(i) + '" cy="' + y(r.purchases_all) + '" r="5" fill="#4ade80"><title>' + r.d + ': ' + r.purchases_all + ' compras (' + r.purchases + ' rastreadas)</title></circle>'; });
      var step = Math.max(1, Math.ceil(n / 10));
      rows.forEach(function(r,i){ if (i % step === 0) svg += '<text x="' + x(i) + '" y="' + (H - 6) + '" fill="#6a6f7d" font-size="10" text-anchor="middle" font-family="JetBrains Mono">' + r.d.slice(5).split('-').reverse().join('/') + '</text>'; });
      svg += '</svg>';
      return svg + '<div class="legend"><span><i style="background:rgba(59,110,245,.6)"></i>Sessões</span>' + (isQuiz ? '<span><i style="background:#a78bfa"></i>Terminaram o quiz</span>' : '<span><i style="background:#ffc46b"></i>Clicaram em comprar</span>') + '<span><i style="background:#4ade80;border-radius:50%"></i>Compras (todas)</span></div>';
    }

    function kv(obj, labels, total, keepOrder){

        return '<span>' + escapeHtml((labels && labels[k]) || k) + '</span><span>' + obj[k] + (total ? ' (' + Math.round(pct(obj[k], total)) + '%)' : '') + '</span>';

    var recentHtml = '<div class="table-wrap"><div class="table-scroll"><table><thead><tr>' +
      '<th>Quando</th><th>Até onde foi</th><th>Idioma</th><th>Aparelho</th><th>País</th><th>Origem</th><th>Tempo</th><th>' + (isQuiz ? 'Respostas' : 'Detalhe') + '</th>' +

      (recent.length ? recent.map(function(r){

        (isQuiz ? '<div class="panel ans"><h3 style="margin-bottom:14px">O que responderam</h3>' + (ansHtml || '<div class="empty-note">Sem respostas ainda</div>') + '</div>'

                  '<h3 style="margin-top:22px">Dúvidas abertas no FAQ</h3><div class="ph">sessões que abriram cada pergunta</div>' + kv(d.faq, FAQ_LABEL) + '</div>') +
      '</div>' +
      '<div class="grid3">' +
        dimTable('Origem (utm_source)', 'source') +
        dimTable('Campanha', 'campaign') +
        dimTable('Anúncio (utm_content)', 'content') +
      '</div>' +
      '<div class="grid3">' +
        dimTable('País', 'geo', countryOf) +
        dimTable('Idioma', 'lang', function(k){ return LANG_LABEL[k] || k; }) +
        dimTable('Aparelho', 'device') +
      '</div>' +
      '<div class="grid3">' +
        dimTable('Navegador / app', 'browser') +
        '<div class="panel"><h3>Compras por origem</h3><div class="ph">utm_source / utm_medium de cada venda na Kiwify</div>' + kv(d.purchases_by_medium) + '</div>' +
        kiwifyPanel() +

      '<div class="panel" style="padding-bottom:6px"><h3>Últimas sessões</h3><div class="ph">as 80 mais recentes no período</div></div>' +
      recentHtml;

    document.getElementById('content').innerHTML = html;

      card('Responderam', T.rated || 0, 'var(--purple)', Math.round(pct(T.rated, T.reached)) + '% de quem recebeu') +
      card('Amando', Math.round(pct(T.love, T.rated)) + '%', 'var(--green)', (T.love||0) + ' de ' + (T.rated||0) + ' avaliações') +
      card('Comentários', T.commented || 0, 'var(--orange)', Math.round(pct(T.commented, T.rated)) + '% de quem avaliou') +
      card('Depoimentos liberados', testimonials.length, 'var(--green)', 'autorizaram usar na página') +
    '</div>';

    var parts = [[3, T.love||0], [2, T.good||0], [1, T.improve||0]];
    var dist = '<div class="panel"><h3>Como os clientes avaliam</h3><div class="ph">resposta ao botão da mensagem</div>' +
      (T.rated
        ? '<div class="fb-bar">' + parts.map(function(p){ return p[1] ? '<i style="width:' + (p[1] / T.rated * 100) + '%;background:' + FB_RATING[p[0]][1] + '" title="' + FB_RATING[p[0]][0] + ': ' + p[1] + '"></i>' : ''; }).join('') + '</div>' +
          '<div class="legend">' + parts.map(function(p){ return '<span><i style="background:' + FB_RATING[p[0]][1] + '"></i>' + FB_RATING[p[0]][0] + ' · ' + p[1] + ' (' + Math.round(pct(p[1], T.rated)) + '%)</span>'; }).join('') + '</div>'
        : '<div class="empty-note">Nenhuma avaliação ainda</div>') +
    '</div>';

    var prints = '<div class="panel"><h3>Prints para a página de vendas</h3><div class="ph">só comentários reais de quem tocou em "Pode sim" · PNG 1080px · aparece só o primeiro nome</div>' +
      (testimonials.length
        ? '<div class="fb-opts">' +
            '<div class="fchip ' + (fbstate.theme==='light'?'on':'') + '" data-fbtheme="light">WhatsApp claro</div>' +
            '<div class="fchip ' + (fbstate.theme==='dark'?'on':'') + '" data-fbtheme="dark">WhatsApp escuro</div>' +
            '<label><input type="checkbox" id="fb-ask"' + (fbstate.showAsk ? ' checked' : '') + '> mostrar a pergunta</label>' +
            '<button class="btn btn-primary" id="fb-all" style="margin-left:auto">Baixar todos</button>' +
          '</div><div class="fb-prints" id="fb-prints"></div>'
        : '<div class="empty-note">Nenhum depoimento liberado ainda. Quando um cliente avaliar bem, comentar e tocar em "Pode sim", o print aparece aqui.</div>') +
    '</div>';

    var CONSENT = { 'true': '✅ liberou pra página', 'false': '🔒 não liberou' };
    var quotes = '<div class="panel"><h3>Comentários</h3><div class="ph">tudo que os clientes escreveram, inclusive quem não liberou pra página</div>' +
      (commented.length ? commented.map(function(r){
        var rt = FB_RATING[r.rating] || ['', 'var(--muted)'];
        return '<div class="fb-quote"><span class="sess-tag" style="background:rgba(255,255,255,.06);color:' + rt[1] + '">' + rt[0] + '</span> ' +
          '<span class="meta">' + escapeHtml(r.name || 'Cliente') + ' · ' + (FB_LANG[r.lang] || '') + ' · ' + fmtDate(r.answered_at) + ' · ' + (CONSENT[String(r.testimonial_ok)] || 'sem resposta sobre uso') + '</span>' +
          '<p>' + escapeHtml(r.comment) + '</p></div>';
      }).join('') : '<div class="empty-note">Nenhum comentário ainda</div>') +
    '</div>';

    var queue = '<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px"><div><h3>Próximos envios</h3><div class="ph" style="margin:0">quem recebe a mensagem no próximo disparo das 10h</div></div><button class="btn" id="fb-queue">Ver fila</button></div><div id="fb-queue-box">' + queueHtml() + '</div></div>';

    var table = '<div class="table-wrap"><div class="table-scroll"><table><thead><tr>' +
      '<th>Cliente</th><th>Idioma</th><th>Status</th><th>Nota</th><th>Enviado</th><th>Avaliou</th><th>Página</th><th>Obs.</th>' +
      '</tr></thead><tbody>' +
      (rows.length ? rows.map(function(r){
        return '<tr><td><span class="who-name">' + escapeHtml(r.name || '·') + '</span></td>' +
          '<td>' + (FB_LANG[r.lang] || '·') + (r.lang_source ? '<span style="display:block;color:var(--dim);font-size:9.5px">' + (FB_SRC[r.lang_source] || '') + '</span>' : '') + '</td>' +
          '<td>' + (FB_STATUS[r.status] || r.status) + (r.manual ? '<span class="tag-manual">manual</span>' : '') + '</td>' +
          '<td>' + (r.rating ? FB_RATING[r.rating][0] : '<span class="empty-dash">·</span>') + '</td>' +
          '<td>' + (r.sent_at ? '<span class="date-cell">' + fmtDate(r.sent_at) + '<span class="rel">' + relTime(r.sent_at) + '</span></span>' : '<span class="empty-dash">·</span>') + '</td>' +
          '<td>' + (r.rated_at ? '<span class="date-cell">' + fmtDate(r.rated_at) + '</span>' : '<span class="empty-dash">·</span>') + '</td>' +
          '<td>' + (r.testimonial_ok === true ? '✅' : r.testimonial_ok === false ? '🔒' : '<span class="empty-dash">·</span>') + '</td>' +
          '<td style="color:var(--dim)">' + escapeHtml(r.error || '') + '</td></tr>';
      }).join('') : '<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--dim)">Nenhum pedido enviado ainda</td></tr>') +
      '</tbody></table></div></div>';

    var manualBox = '<div class="panel" id="fb-manual"></div>';

    document.getElementById('content').innerHTML = bar + cards + '<div class="grid2">' + dist + queue + '</div>' + manualBox + prints + quotes +
      '<div class="panel" style="padding-bottom:6px"><h3>Todos os pedidos</h3><div class="ph">um por compra</div></div>' + table;

    document.querySelectorAll('.fchip[data-fbdays]').forEach(function(c){ c.addEventListener('click', function(){ fbstate.days = +c.dataset.fbdays; saveFb(); loadFeedback(); }); });
    document.querySelectorAll('.fchip[data-fbtheme]').forEach(function(c){ c.addEventListener('click', function(){ fbstate.theme = c.dataset.fbtheme; saveFb(); renderFeedback(); }); });
    var ask = document.getElementById('fb-ask');
    if (ask) ask.addEventListener('change', function(){ fbstate.showAsk = ask.checked; saveFb(); renderFeedback(); });
    document.getElementById('fb-queue').addEventListener('click', loadFbQueue);
    renderManual();

    var box = document.getElementById('fb-prints');
    if (box) {
      testimonials.forEach(function(r){
        var canvas = drawPrint(r, fbstate.theme, fbstate.showAsk);
        var item = document.createElement('div'); item.className = 'fb-print';
        var btn = document.createElement('button'); btn.className = 'btn';
        btn.textContent = 'Baixar PNG · ' + firstName(r.name) + ' (' + (FB_LANG[r.lang] || '') + ')';
        btn.addEventListener('click', function(){ downloadPrint(canvas, r); });
        item.appendChild(canvas); item.appendChild(btn); box.appendChild(item);
      });
      document.getElementById('fb-all').addEventListener('click', function(){
        var i = 0;
        (function next(){
          if (i >= testimonials.length) return;
          var r = testimonials[i++];
          downloadPrint(drawPrint(r, fbstate.theme, fbstate.showAsk), r);
          setTimeout(next, 300); // navegador bloqueia downloads em rajada
        })();
      });
    }
  }

  // ---- envio manual ----
  function selectedIds(){
    var L = fbstate.list;
    if (!L) return [];
    return L.customers.filter(function(c){ return c.can_send && fbstate.sel[c.license_id]; }).map(function(c){ return c.license_id; });
  }

  function renderManual(){
    var box = document.getElementById('fb-manual');
    if (!box) return;
    var head = '<h3>Enviar manualmente</h3><div class="ph">escolha os clientes e mande o pedido de feedback agora, sem esperar os 7 dias · o idioma é detectado sozinho (escolheu no site → país da compra → DDI), mas dá pra trocar</div>';
    var L = fbstate.list;
    if (!L) {
      box.innerHTML = head + (fbstate.listErr ? '<div class="grant-msg err">Erro: ' + escapeHtml(fbstate.listErr) + '</div>' : '<div class="empty-note" style="padding:14px">Carregando clientes…</div>');
      return;
    }
    var q = fbstate.search.trim().toLowerCase();
    var rows = L.customers.filter(function(c){
      return (!fbstate.onlySendable || c.can_send) && (!q || (c.name || '').toLowerCase().indexOf(q) !== -1);
    });
    var sendable = rows.filter(function(c){ return c.can_send; });
    var allOn = sendable.length > 0 && sendable.every(function(c){ return fbstate.sel[c.license_id]; });
    var nSel = selectedIds().length;
    var langs = L.supported_langs || ['pt_BR', 'es', 'en'];

    var controls = '<div class="filters" style="margin-bottom:12px">' +
      '<div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
      '<input type="text" id="fb-search" placeholder="Buscar cliente pelo nome…" value="' + escapeAttr(fbstate.search) + '"/></div>' +
      '<div class="fchip ' + (fbstate.onlySendable ? 'on' : '') + '" data-fbonly="1">Podem receber (' + L.customers.filter(function(c){ return c.can_send; }).length + ')</div>' +
      '<div class="fchip ' + (!fbstate.onlySendable ? 'on' : '') + '" data-fbonly="0">Todos (' + L.customers.length + ')</div>' +
      '<button class="btn btn-primary" id="fb-send"' + (!nSel || !L.configured || fbstate.sending ? ' disabled style="opacity:.5;cursor:not-allowed"' : '') + '>' +
        (fbstate.sending ? 'Enviando…' : 'Enviar para ' + nSel + ' selecionado' + (nSel === 1 ? '' : 's')) + '</button>' +
    '</div>' +
    (L.configured ? '' : '<div class="grant-msg err" style="margin:0 0 10px">WhatsApp ainda não configurado: dá pra escolher e conferir o idioma, mas o envio só funciona depois dos secrets WA_TOKEN e WA_PHONE_NUMBER_ID no Supabase.</div>');

    var table = '<div class="table-scroll" style="max-height:420px;overflow-y:auto"><table class="mini"><thead><tr>' +
      '<th style="width:28px"><input type="checkbox" id="fb-all-sel"' + (allOn ? ' checked' : '') + (sendable.length ? '' : ' disabled') + ' style="accent-color:var(--accent)"></th>' +
      '<th>Cliente</th><th>Idioma detectado</th><th>Enviar em</th><th>Feedback</th></tr></thead><tbody>' +
      (rows.length ? rows.map(function(c){
        var cur = fbstate.langPick[c.license_id] || '';
        var status = !c.phone_ok ? '<span style="color:var(--orange)">' + (c.has_phone ? 'telefone inválido' : 'sem telefone') + '</span>'
          : c.feedback_status ? (FB_STATUS[c.feedback_status] || c.feedback_status) + (c.feedback_sent_at ? ' <span style="color:var(--dim)">· ' + relTime(c.feedback_sent_at) + '</span>' : '')
          : '<span style="color:var(--dim)">nunca recebeu</span>';
        return '<tr>' +
          '<td><input type="checkbox" class="fb-sel" data-id="' + c.license_id + '"' + (fbstate.sel[c.license_id] ? ' checked' : '') + (c.can_send ? '' : ' disabled') + ' style="accent-color:var(--accent)"></td>' +
          '<td class="k" style="max-width:220px"><span class="who-name">' + escapeHtml(c.name || 'Cliente') + '</span> <span style="color:var(--dim)">· comprou ' + relTime(c.purchased_at) + '</span></td>' +
          '<td>' + (c.lang ? '<b style="color:var(--ink)">' + FB_LANG[c.lang] + '</b> <span style="color:var(--dim)">· ' + (FB_SRC[c.lang_source] || '') + '</span>' : '<span class="empty-dash">·</span>') + '</td>' +
          '<td><select class="fb-lang" data-id="' + c.license_id + '"' + (c.can_send ? '' : ' disabled') + ' style="background:var(--card2);color:var(--ink);border:1px solid var(--line-2);border-radius:7px;padding:4px 6px;font-family:var(--font);font-size:11.5px">' +
            '<option value="">Auto (' + (c.lang ? FB_LANG[c.lang] : '?') + ')</option>' +
            langs.map(function(l){ return '<option value="' + l + '"' + (cur === l ? ' selected' : '') + '>' + FB_LANG[l] + '</option>'; }).join('') +
          '</select></td>' +
          '<td>' + status + '</td></tr>';
      }).join('') : '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--dim)">Nenhum cliente</td></tr>') +
      '</tbody></table></div>' +
      '<div class="count-line" style="margin-top:10px">quem já avaliou não aparece como "pode receber" · reenviar pra quem não respondeu troca os botões da mensagem antiga</div>';

    box.innerHTML = head + controls + table;

    var search = document.getElementById('fb-search');
    search.addEventListener('input', function(){
      var pos = search.selectionStart;
      fbstate.search = search.value; renderManual();
      var s2 = document.getElementById('fb-search'); s2.focus(); s2.setSelectionRange(pos, pos);
    });
    box.querySelectorAll('.fchip[data-fbonly]').forEach(function(c){ c.addEventListener('click', function(){ fbstate.onlySendable = c.dataset.fbonly === '1'; renderManual(); }); });
    box.querySelectorAll('.fb-sel').forEach(function(cb){ cb.addEventListener('change', function(){ fbstate.sel[cb.dataset.id] = cb.checked; renderManual(); }); });
    box.querySelectorAll('.fb-lang').forEach(function(s){ s.addEventListener('change', function(){ fbstate.langPick[s.dataset.id] = s.value; }); });
    document.getElementById('fb-all-sel').addEventListener('change', function(){
      var on = this.checked;
      sendable.forEach(function(c){ fbstate.sel[c.license_id] = on; });
      renderManual();
    });
    document.getElementById('fb-send').addEventListener('click', sendManual);
  }

  function sendManual(){
    var ids = selectedIds();
    if (!ids.length || fbstate.sending) return;
    if (!confirm('Enviar o pedido de feedback no WhatsApp agora para ' + ids.length + ' cliente(s)?')) return;

    // um envio por idioma escolhido ("" = automático), em lotes de 50 (limite da função)
    var groups = {};
    ids.forEach(function(id){ var l = fbstate.langPick[id] || ''; (groups[l] = groups[l] || []).push(id); });
    var calls = [];
    Object.keys(groups).forEach(function(l){
      for (var i = 0; i < groups[l].length; i += 50) calls.push({ mode: 'manual', license_ids: groups[l].slice(i, i + 50), lang: l || undefined });
    });

    fbstate.sending = true; renderManual();
    var tot = { sent: 0, failed: 0, skipped: 0 }, errs = [], pending = calls.length;
    calls.forEach(function(body){
      fbCall('feedback-send', body, function(ok, d){
        if (ok) { tot.sent += d.sent || 0; tot.failed += d.failed || 0; tot.skipped += (d.skipped || 0) + (d.not_allowed || 0); }
        else errs.push(d.error === 'whatsapp_not_configured' ? 'WhatsApp não configurado' : (d.error || 'erro'));
        if (--pending) return;
        fbstate.sending = false; fbstate.sel = {}; fbstate.langPick = {};
        if (errs.length) showToast('Erro: ' + errs[0], 'err');
        else showToast(tot.sent + ' enviado(s)' + (tot.failed ? ' · ' + tot.failed + ' falha(s)' : '') + (tot.skipped ? ' · ' + tot.skipped + ' pulado(s)' : ''), tot.failed ? 'err' : 'ok');
        loadFeedback();
      });
    });
  }

  function queueHtml(){
    var q = fbstate.queue;
    if (!q) return '<div class="empty-note" style="padding:14px">Clique em "Ver fila" pra conferir</div>';
    var warn = q.configured ? '' : '<div class="grant-msg err" style="margin:0 0 10px">WhatsApp ainda não configurado: nada é enviado até os secrets WA_TOKEN e WA_PHONE_NUMBER_ID existirem no Supabase.</div>';
    if (!q.queue || !q.queue.length) return warn + '<div class="empty-note" style="padding:14px">Ninguém na fila agora</div>';
    return warn + '<div class="kv">' + q.queue.map(function(c){
      return '<span>' + escapeHtml(c.name || 'Cliente') + ' · ' + (c.lang ? FB_LANG[c.lang] + ' <span style="color:var(--dim)">(' + (FB_SRC[c.lang_source] || '') + ')</span>' : '?') + (c.phone_ok ? '' : ' <span style="color:var(--orange)">· telefone inválido, será pulado</span>') + '</span><span>comprou ' + relTime(c.purchased_at) + '</span>';
    }).join('') + '</div>';
  }

  function loadFbQueue(){
    document.getElementById('fb-queue-box').innerHTML = '<div class="empty-note" style="padding:14px">Carregando…</div>';
    fbCall('feedback-send', { dry_run: true }, function(ok, d){
      fbstate.queue = ok ? d : { configured: true, queue: [] };
      var box = document.getElementById('fb-queue-box');
      if (box) box.innerHTML = ok ? queueHtml() : '<div class="grant-msg err">Erro: ' + escapeHtml(d.error || 'falha ao carregar') + '</div>';
    });
  }

  // ---- print estilo WhatsApp desenhado em canvas ----
  var WA_THEME = {
    light: { header:'#f0f2f5', name:'#111b21', sub:'#667781', bg:'#efeae2', inB:'#ffffff', outB:'#d9fdd3', text:'#111b21', time:'#667781' },
    dark:  { header:'#202c33', name:'#e9edef', sub:'#8696a0', bg:'#0b141a', inB:'#202c33', outB:'#005c4b', text:'#e9edef', time:'#8696a0' }
  };
  var WA_FONT = '"Segoe UI", "Helvetica Neue", Helvetica, Arial, "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
  function firstName(n){
    var f = String(n || '').trim().split(/\s+/)[0] || 'Cliente';
    return f.charAt(0).toUpperCase() + f.slice(1).toLowerCase();
  }
  function hhmm(iso){ return new Date(iso).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }); }

  function wrapText(ctx, text, maxW){
    var lines = [];
    String(text).split('\n').forEach(function(para){
      var line = '';
      para.split(/\s+/).forEach(function(word){
        var test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width <= maxW) { line = test; return; }
        if (line) lines.push(line);
        // palavra maior que a linha inteira: quebra por caractere
        line = '';
        Array.from(word).forEach(function(ch){
          if (ctx.measureText(line + ch).width > maxW) { lines.push(line); line = ch; } else line += ch;
        });
      });
      lines.push(line);
    });
    return lines;
  }

  function drawPrint(r, theme, showAsk){
    var t = WA_THEME[theme], S = 2, W = 540, PAD = 16, HEADER = 64, BMAX = W * 0.78, LH = 22, TIME_W = 44;
    var canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
    ctx.font = '15px ' + WA_FONT;
    var bubbles = [];
    if (showAsk) bubbles.push({ out: true, lines: wrapText(ctx, FB_ASK[r.lang] || FB_ASK.en, BMAX - 24 - TIME_W), time: hhmm(r.rated_at || r.answered_at) });
    bubbles.push({ out: false, lines: wrapText(ctx, r.comment, BMAX - 24 - TIME_W), time: hhmm(r.answered_at) });

    var H = HEADER + PAD * 2;
    bubbles.forEach(function(b){ H += b.lines.length * LH + 26; });
    canvas.width = W * S; canvas.height = H * S;
    ctx.scale(S, S);
    ctx.fillStyle = t.bg; ctx.fillRect(0, 0, W, H);

    // cabeçalho: avatar com a inicial + primeiro nome
    var name = firstName(r.name);
    ctx.fillStyle = t.header; ctx.fillRect(0, 0, W, HEADER);
    ctx.fillStyle = '#6b7c85'; ctx.beginPath(); ctx.arc(PAD + 20, HEADER / 2, 20, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '600 18px ' + WA_FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(name.charAt(0), PAD + 20, HEADER / 2 + 1);
    ctx.textAlign = 'left'; ctx.fillStyle = t.name; ctx.font = '600 16px ' + WA_FONT;
    ctx.fillText(name, PAD + 52, HEADER / 2 - 8);
    ctx.fillStyle = t.sub; ctx.font = '13px ' + WA_FONT;
    ctx.fillText('Cliente dropSFX', PAD + 52, HEADER / 2 + 11);

    var y = HEADER + PAD;
    bubbles.forEach(function(b){
      ctx.font = '15px ' + WA_FONT;
      var textW = Math.max.apply(null, b.lines.map(function(l){ return ctx.measureText(l).width; }));
      var bw = Math.min(BMAX, textW + 24 + TIME_W), bh = b.lines.length * LH + 18;
      var x = b.out ? W - PAD - bw : PAD;
      ctx.fillStyle = b.out ? t.outB : t.inB;
      ctx.shadowColor = 'rgba(0,0,0,.13)'; ctx.shadowOffsetY = 1; ctx.shadowBlur = 1;
      ctx.beginPath(); ctx.roundRect(x, y, bw, bh, 8); ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.fillStyle = t.text; ctx.textBaseline = 'top';
      b.lines.forEach(function(l, i){ ctx.fillText(l, x + 12, y + 8 + i * LH); });
      ctx.fillStyle = t.time; ctx.font = '11px ' + WA_FONT; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(b.out ? b.time + ' ✓✓' : b.time, x + bw - 9, y + bh - 7);
      ctx.textAlign = 'left';
      y += bh + 8;
    });
    return canvas;
  }

  function downloadPrint(canvas, r){
    var a = document.createElement('a');
    a.download = 'depoimento-' + firstName(r.name).toLowerCase() + '-' + String(r.answered_at).slice(0, 10) + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  function exportFeedbackCSV(){
    var rows = (fbstate.data && fbstate.data.rows) || [];
    var head = ['nome','idioma','status','nota','comentario','liberou_pagina','enviado','avaliou','comentou','erro'];
    var lines = [head.join(',')];
    rows.forEach(function(r){
      lines.push([r.name, r.lang, FB_STATUS[r.status] || r.status, r.rating ? FB_RATING[r.rating][0] : '', r.comment, r.testimonial_ok == null ? '' : (r.testimonial_ok ? 'sim' : 'nao'), r.sent_at, r.rated_at, r.answered_at, r.error].map(csvCell).join(','));
    });
    var blob = new Blob([lines.join('\n')], { type:'text/csv;charset=utf-8;' });
    var u = URL.createObjectURL(blob), el = document.createElement('a');
    el.href = u; el.download = 'dropsfx-feedback-' + new Date().toISOString().slice(0,10) + '.csv'; el.click(); URL.revokeObjectURL(u);
  }

  function escapeHtml(s){ return (s||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
</script>
