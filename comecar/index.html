      if (/^Asia\/(Calcutta|Kolkata)$/.test(z)) return 'in';
      if (/^Asia\/(Jakarta|Makassar|Jayapura|Pontianak)$/.test(z)) return 'id';
      if (/^Africa\//.test(z)) return 'af';
      return '';
    }

    function checkoutUrl(pos) {
      var p = new URLSearchParams();
      p.set('utm_source', 'quiz');
      p.set('utm_medium', pos);
      p.set('utm_campaign', TR.ctx.utm_campaign || 'dropsfx');
      if (kit) p.set('utm_content', (kit.a.type || 'x') + '-' + (kit.a.vibe || 'x'));
      if (TR.ctx.utm_content) p.set('utm_term', TR.ctx.utm_content);
      p.set('src', TR.ctx.utm_source || 'direto');
      p.set('sck', TR.sid);   // liga a compra (webhook da Kiwify) a esta sessão do quiz
      return CONFIG.checkout + '?' + p.toString();
    }

    function wave(seed) {
      var x = seed * 9301 + 49297, h = '';
      for (var i = 0; i < 26; i++) { x = (x * 9301 + 49297) % 233280; h += '<i style="height:' + Math.round(18 + (x / 233280) * 82) + '%"></i>'; }
      return h;
    }

    function renderResult() {
      var a = kit.a;
      var picks = recommend(a);
      var name = (a.name || '').trim();
      $('rHello').innerHTML = name ? t('r.hello').replace('{name}', esc(name)) : t('r.hello0');
      $('rChips').innerHTML =
        '<span class="r-chip"><b>' + esc(t('r.c.type')) + '</b>' + esc(t('type.' + a.type)) + '</span>' +
        '<span class="r-chip"><b>' + esc(t('r.c.vibe')) + '</b>' + esc(t('vibe.' + a.vibe)) + '</span>' +
        '<span class="r-chip"><b>' + esc(t('r.c.app')) + '</b>' + esc(t('app.' + a.app)) + '</span>';

      var total = picks.reduce(function (s, p) { return s + p.n; }, 0);
      $('kitTitle').textContent = t('r.kitTitle');
      $('kitCount').textContent = t('r.kitCount').replace('{n}', num(total));
      var names = CAT_NAMES[lang] || CAT_NAMES.pt;
      $('kitGrid').innerHTML = picks.map(function (p, i) {
        return '<div class="kc" style="--c:' + p.color + ';animation-delay:' + (i * 70) + 'ms">' +
          '<div class="kc-ic">' + catIc(p.id) + '</div><div class="kc-deco" aria-hidden="true"><i style="height:45%"></i><i style="height:80%"></i><i style="height:60%"></i><i style="height:100%"></i></div>' +
          '<div class="kc-name">' + esc(names[p.id] || p.id) + '</div>' +
          '<div class="kc-n"><b>' + p.n + '</b> ' + esc(t('r.kitCount').replace('{n}', '').trim()) + '</div>' +
          '<div class="kc-why">' + esc(p.why) + '</div></div>';
      }).join('');
      $('kitMore').innerHTML = t('r.kitMore');

      // diagnóstico de tempo
      var h = hoursOf(a), d = Math.floor(h / 8);
      var big = h < 1 ? Math.round(h * 60) + ' min' : Math.round(h) + 'h';
      $('diag').innerHTML =
        '<div class="d-big">≈ ' + big + '</div>' +
        '<span class="d-unit">' + esc(t(a.source === 'none' ? 'd.unit3' : 'd.unit')) + '</span>' +
        '<p class="d-why">' + esc(t('d.why').replace('{m}', num(MIN[+a.time || 0])).replace('{v}', num(VID[+a.volume || 0]))) + '</p>' +
        '<p class="d-days">' + (d >= 2 ? t('d.days').replace('{d}', d) : d === 1 ? t('d.day1') : t('d.small')) + '</p>' +
        '<p class="d-fix">' + esc(t('d.fix.' + (a.source || 'yt'))) + '</p>' +
        '<p class="d-ok' + (a.app === 'other' ? ' warn' : '') + '">' + esc(t('d.ok.' + (a.app || 'premiere'))) + '</p>';

      var insideT = document.querySelector('[data-t="p.inside.t"]');
      if (insideT) insideT.textContent = t('p.inside.t').replace('{app}', t('appname.' + (a.app || 'premiere')));
      $('oWho').textContent = name ? name + ' · ' + t('o.who').replace('{type}', t('short.' + a.type)) : t('o.who').replace('{type}', t('short.' + a.type));
      // fora do Brasil o preço aparece em dólar (a Kiwify cobra na moeda local do cartão)
      var priceNow = priceFor();
      [].forEach.call(document.querySelectorAll('.js-pnote'), function (el) { el.textContent = priceNow + ' · ' + t('o.terms'); });
      var rg = region(); $('ckTip').hidden = !rg; if (rg) $('ckTip').innerHTML = t('ck.tip.' + rg);
      [].forEach.call(document.querySelectorAll('.js-wa'), function (el) { el.href = 'https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(t('wa.msg')); });
      $('oPrice').innerHTML = '<b>' + priceNow + '</b>' + (priceNow === CONFIG.price ? '' : '<span>' + esc(t('o.usd')) + '</span>');
      var ss = document.querySelector('.sticky-s'); if (ss) ss.textContent = priceNow + ' · ' + t('s.sub');
      $('ck3').innerHTML = t('ck.3').replace('{usd}', priceNow);
      $('stickyT').textContent = (a.name ? t('s.titleName').replace('{name}', a.name) : t('s.title'));

      // FAQ (mesmas respostas do site)
      var fq = FAQ[lang] || FAQ.pt, order = [4, 9, 7, 8, 5, 1];
      $('faq').innerHTML = order.map(function (i) {
        return '<div class="faq-item"><button type="button" class="faq-q" data-i="' + i + '"><span>' + esc(fq['faq.q' + i]) + '</span><span>+</span></button><div class="faq-a">' + esc(fq['faq.a' + i]) + '</div></div>';
      }).join('');
      [].forEach.call(document.querySelectorAll('.faq-q'), function (b) {
        b.addEventListener('click', function () {
          var it = b.parentNode, open = !it.classList.contains('open');
          it.classList.toggle('open', open);
          if (open) TR.ev('faq_open', b.getAttribute('data-i'));
        });
      });

      [].forEach.call(document.querySelectorAll('.js-cta'), function (el) { el.href = checkoutUrl(el.getAttribute('data-pos')); });

      // simulador: o painel do plugin rodando num "Premiere", começando pelas categorias do kit
      var prio = picks.map(function (p) { return SFX_CAT[p.id] || p.id; }), prioKey = prio.join(',');
      mountSim(prioKey);
      $('vidSound').lastChild.textContent = t(vid.muted ? 'v.on' : 'v.off');
    }

    var resultWired = false, simKey = null, simObs = null;
    function simSrc(k) { return '/simulador/?embed=1&lang=' + lang + '&prio=' + encodeURIComponent(k); }
    function mountSim(k) {
      var f = $('simFrame');
      if (simKey === k) { try { f.contentWindow.postMessage({ type: 'dropsfx-sim-cmd', lang: lang }, '*'); } catch (e) {} return; }
      var loadNow = simKey !== null && f.getAttribute('src');
      simKey = k;
      if (loadNow) { f.src = simSrc(k); return; }
      if (simObs) simObs.disconnect();
      if ('IntersectionObserver' in window) {
        simObs = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { f.src = simSrc(simKey); simObs.disconnect(); } }, { rootMargin: '900px 0px' });
        simObs.observe(f);
      } else f.src = simSrc(k);
    }
    // eventos que o simulador manda (rastreio + rolagem no celular)
    window.addEventListener('message', function (e) {
      var f = $('simFrame'), d = e.data || {};
      if (!f || e.source !== f.contentWindow || d.type !== 'dropsfx-sim') return;
      var x = d.data || {};
      switch (d.ev) {
        case 'height': if (window.innerWidth < 860 && x.h > 400) f.style.height = x.h + 'px'; else f.style.height = ''; break;
        case 'ready': TR.ev('sim_ready'); break;
        case 'open_folder': TR.ev('sim_folder', x.cat); break;
        case 'sfx_play': TR.ev('sfx_play', x.id, { cat: x.cat, hover: !!x.hover }); break;
        case 'insert': TR.ev('sim_insert', x.id, x); pixel('SimInsert', { cat: x.cat }); break;
        case 'play': TR.ev('sim_play', null, x); break;
        case 'demo': TR.ev('sim_demo'); break;
        case 'step': TR.ev('sim_step', String(x.n)); break;
        case 'community': TR.ev('sim_community'); break;
        case 'reveal': window.scrollTo({ top: f.getBoundingClientRect().top + window.scrollY + (x.y || 0) - 70, behavior: 'smooth' }); break;
        case 'cta':
          TR.ev('sim_cta', x.cat || null, null, true);
          var o = document.getElementById('oferta'); if (o) window.scrollTo({ top: o.getBoundingClientRect().top + window.scrollY - 40, behavior: 'smooth' });
          break;
      }
    });
    function showResult(mode) {
      show('result');
      renderResult();
      TR.ev('result_view', mode);
      if (window.dropsfxEvent) window.dropsfxEvent('ViewContent', { content_name: 'dropSFX Full', content_type: 'product', content_ids: ['dropsfx-full'], value: CONFIG.pixelValue, currency: CONFIG.currency });
      if (!resultWired) { resultWired = true; wireResult(); }
    }

    // ---------- vídeo, scroll, CTA, sticky ----------
    var vid = $('vid');
    function wireResult() {
      // CTA
      [].forEach.call(document.querySelectorAll('.js-cta'), function (el) {
        el.addEventListener('click', function (e) {
          var pos = el.getAttribute('data-pos');
          el.href = checkoutUrl(pos);
          TR.ev('cta_click', pos, null, true);
          // quem é de fora vê antes como passar pelo checkout brasileiro (país, sem CPF, cartão)
          if (needHelp()) { e.preventDefault(); openHelp(pos); return; }
          initCheckout();
        });
      });
      var ck = $('ck'), ckGo = $('ckGo'), ckSeen = false, ckPos = '';
      function needHelp() {
        if (ckSeen) return false;
        var br = /^America\/(Sao_Paulo|Fortaleza|Recife|Bahia|Belem|Maceio|Manaus|Cuiaba|Campo_Grande|Porto_Velho|Boa_Vista|Rio_Branco|Araguaina|Santarem|Noronha|Eirunepe)$/.test(TR.tz || '');
        return lang !== 'pt' || (TR.tz && !br);
      }
      function openHelp(pos) {
        ckPos = pos; ckGo.href = checkoutUrl(pos);
        ck.hidden = false; document.documentElement.style.overflow = 'hidden';
        TR.ev('checkout_help', pos, null, true);
      }
      function closeHelp() { ck.hidden = true; document.documentElement.style.overflow = ''; }
      ckGo.addEventListener('click', function () {
        ckSeen = true; ckGo.href = checkoutUrl(ckPos);
        TR.ev('checkout_go', ckPos, null, true);
        initCheckout();
        setTimeout(closeHelp, 300);
      });
      [].forEach.call(ck.querySelectorAll('[data-close]'), function (b) {
        b.addEventListener('click', function () { TR.ev('checkout_help_close', ckPos); closeHelp(); });
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !ck.hidden) closeHelp(); });
      // ---------- volta do checkout: pergunta o que travou ----------
      var bk = $('bk'), bkShown = false, ckAt = 0, bkReason = '';
      function openBack() {
        if (bkShown || screen !== 'result' || !ck.hidden) return;
        bkShown = true;
        try { sessionStorage.setItem('dropsfx_bk', '1'); } catch (e) {}
        $('bkOpts').hidden = false; $('bkAns').hidden = true;
        bk.hidden = false; document.documentElement.style.overflow = 'hidden';
        TR.ev('checkout_back', null, { s: Math.round((Date.now() - ckAt) / 1000) }, true);
      }
      function closeBack() { bk.hidden = true; document.documentElement.style.overflow = ''; }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && ckAt && Date.now() - ckAt > 6000) setTimeout(openBack, 450);
      });
      [].forEach.call(bk.querySelectorAll('.bk-opt'), function (b) {
        b.addEventListener('click', function () {
          bkReason = b.getAttribute('data-r');
          TR.ev('checkout_reason', bkReason, null, true);
          $('bkTxt').innerHTML = t('bk.a.' + bkReason);
          $('bkRetry').hidden = bkReason === 'bought';
          $('bkGuide').hidden = bkReason !== 'bought';
          $('bkRetry').href = checkoutUrl('back');
          $('bkOpts').hidden = true; $('bkAns').hidden = false;
        });
      });
      $('bkRetry').addEventListener('click', function () {
        $('bkRetry').href = checkoutUrl('back');
        TR.ev('cta_click', 'back', { reason: bkReason }, true);
        initCheckout();
        setTimeout(closeBack, 300);
      });
      [].forEach.call(bk.querySelectorAll('[data-close]'), function (b) {
        b.addEventListener('click', function () { TR.ev('checkout_back_close', bkReason || null); closeBack(); });
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !bk.hidden) closeBack(); });
      [].forEach.call(document.querySelectorAll('.js-wa'), function (el) {
        el.addEventListener('click', function () { TR.ev('whatsapp_click', el.getAttribute('data-pos'), { reason: bkReason || null }, true); });
      });

      // no app do Instagram o checkout pode abrir por cima e a página recarrega na volta: lembra o horário na sessão
      function backFromStorage() {
        try {
          var sv = +sessionStorage.getItem('dropsfx_ckat') || 0;
          if (sv && !sessionStorage.getItem('dropsfx_bk') && Date.now() - sv > 6000 && Date.now() - sv < 7200000) { ckAt = sv; setTimeout(openBack, 1200); }
        } catch (e) {}
      }
      backFromStorage();
      window.addEventListener('pageshow', function (e) { if (e.persisted) backFromStorage(); });

      function initCheckout() {
        ckAt = Date.now();
        try { sessionStorage.setItem('dropsfx_ckat', String(ckAt)); } catch (e) {}
        if (window.dropsfxEvent) window.dropsfxEvent('InitiateCheckout', { content_name: 'dropSFX Full', content_ids: ['dropsfx-full'], content_type: 'product', value: CONFIG.pixelValue, currency: CONFIG.currency, num_items: 1 });
      }

      // sticky aparece depois que o primeiro botão sai da tela
      var first = document.querySelector('.cta-row .js-cta'), sticky = $('sticky');
      if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (es) {
          var e = es[0];
          sticky.classList.toggle('show', screen === 'result' && !e.isIntersecting && e.boundingClientRect.top < 0);
        }).observe(first);
        // some enquanto o simulador está na tela (não cobrir a timeline)
        new IntersectionObserver(function (es) {
          document.body.classList.toggle('sim-on', es[0].isIntersecting);
        }, { threshold: .25 }).observe($('simFrame'));
        // some quando o card da oferta está na tela
        new IntersectionObserver(function (es) {
          if (es[0].isIntersecting) sticky.classList.remove('show');
        }, { threshold: .4 }).observe(document.querySelector('.offer'));
      }

      // vídeo: carrega perto da tela, toca mudo quando visível
      var src = vid.querySelector('source'), loaded = false, played = false, marks = {}, soundTracked = false;
      function load() { if (loaded) return; loaded = true; src.src = src.getAttribute('data-src'); vid.load(); }
      if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (es) { if (es[0].isIntersecting) load(); }, { rootMargin: '400px 0px' }).observe(vid);
        new IntersectionObserver(function (es) {
          if (es[0].isIntersecting) { load(); var p = vid.play(); if (p && p.catch) p.catch(function () {}); }
          else vid.pause();
        }, { threshold: .4 }).observe(vid);
      } else { load(); }
      vid.addEventListener('play', function () { if (!played) { played = true; TR.ev('video_play'); } });
      vid.addEventListener('timeupdate', function () {
        var d = vid.duration || 0, c = vid.currentTime || 0;
        if (!d) return;
        $('vidProg').style.width = (c / d * 100) + '%';
        var s = Math.floor(c);
        $('vidTc').textContent = '00:00:' + (s < 10 ? '0' : '') + s;
        [25, 50, 75, 95].forEach(function (m) {
          if (!marks[m] && c / d * 100 >= m) { marks[m] = 1; TR.ev('video_progress', String(m === 95 ? 100 : m)); }
        });
      });
      $('vidSound').addEventListener('click', function () {
        var on = vid.muted;
        vid.muted = !on;
        this.setAttribute('aria-pressed', on ? 'true' : 'false');
        this.lastChild.textContent = t(on ? 'v.off' : 'v.on');
        if (on) {
          load(); vid.currentTime = 0;
          var p = vid.play(); if (p && p.catch) p.catch(function () {});
          if (!soundTracked) { soundTracked = true; TR.ev('video_sound'); }
        }
      });

      // profundidade de rolagem
      var depth = {};
      window.addEventListener('scroll', function () {
        if (screen !== 'result') return;
        var h = document.documentElement.scrollHeight - innerHeight;
        if (h <= 0) return;
        var pct = scrollY / h * 100;
        [25, 50, 75, 100].forEach(function (m) {
          if (!depth[m] && pct >= m - 2) { depth[m] = 1; TR.ev('scroll', String(m)); }
        });
      }, { passive: true });

      $('redo').addEventListener('click', function () {
        TR.ev('redo_quiz');
        try { localStorage.removeItem('dropsfx_kit'); } catch (e) {}
        kit = null;
        $('sticky').classList.remove('show');
        startQuiz();
      });
      $('siteLink').addEventListener('click', function () { TR.ev('site_link', null, null, true); });
    }

    // =====================================================================
    // INÍCIO
    // =====================================================================
    [].forEach.call(document.querySelectorAll('#langMini button'), function (b) {
      b.addEventListener('click', function () {
        var l = b.getAttribute('data-lang');
        if (l === lang) return;
        store('dropsfx_lang_manual', '1');
        setLang(l);
        TR.ev('lang_change', screen, { lang: l });
      });
    });

    var suggested = detectLang();
    [].forEach.call(document.querySelectorAll('.lang-opt'), function (b) {
      var l = b.getAttribute('data-lang');
      if (l === suggested) b.classList.add('suggested');
      b.addEventListener('click', function () {
        store('dropsfx_lang_manual', '1');
        setLang(l);
        TR.ev('lang_select', null, { lang: l, suggested: suggested, matched: l === suggested, device: navigator.language || '' });
        pixel('LangSelect', { lang: l });
        startQuiz();
      });
    });
    // idioma sugerido primeiro na lista
    var list = document.querySelector('.lang-list'), sug = list.querySelector('[data-lang="' + suggested + '"]');
    if (sug) list.insertBefore(sug, list.firstChild);
    var ttl = $('langTitle'), tsug = ttl.querySelector('[data-lang="' + suggested + '"]');
    if (tsug) ttl.insertBefore(tsug, ttl.firstChild);

    var params = new URLSearchParams(location.search);
    if (params.has('funil')) { try { localStorage.removeItem('dropsfx_kit'); } catch (e) {} }
    try { kit = JSON.parse(read('dropsfx_kit') || 'null'); } catch (e) { kit = null; }
    if (kit && !(kit.a && kit.a.type && kit.a.vibe)) kit = null;

    var urlLang = (params.get('lang') || '').slice(0, 2).toLowerCase();
    if (LANGS.indexOf(urlLang) < 0) urlLang = '';
    var savedLang = read('dropsfx_lang');
    if (LANGS.indexOf(savedLang) < 0) savedLang = '';
    var devLang = String((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase().slice(0, 2);
    if (LANGS.indexOf(devLang) < 0) devLang = '';
    // ordem: escolha manual > idioma do aparelho (quando o link só diz "en") > ?lang= > salvo > sugerido
    function pickLang(fallback) {
      if (read('dropsfx_lang_manual') === '1' && savedLang) return { l: savedLang, via: 'manual' };
      if (urlLang) return (urlLang === 'en' && devLang && devLang !== 'en') ? { l: devLang, via: 'device' } : { l: urlLang, via: 'url' };
      return { l: fallback, via: 'auto' };
    }

    if (kit) {
      // já fez o quiz: volta direto pro kit dele
      setLang(pickLang(savedLang || kit.lang || suggested).l);
      TR.ev('page_view', 'return');
      showResult('return');
    } else if (urlLang) {
      // anúncio já com idioma (?lang=en): pula a escolha
      var pk = pickLang(urlLang);
      setLang(pk.l);
      TR.ev('page_view', 'lang_url');
      TR.ev('lang_select', null, { lang: pk.l, suggested: suggested, via: pk.via, url: urlLang, device: navigator.language || '' });
      startQuiz();
    } else {
      setLang(suggested);
      show('lang');
      TR.ev('page_view', 'lang');
    }
  })();
  </script>
</body>
</html>
