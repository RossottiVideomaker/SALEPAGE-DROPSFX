  <style>
    :root {
      --bg: #000; --ink: #fff; --ink-2: #c4c8d4; --muted: #888d99; --dim: #4a4d57;
      --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
      --accent: #3b6ef5; --accent-hi: #6e9bff; --accent-glow: rgba(59,110,245,.5); --accent-soft: rgba(59,110,245,.14);
      --ice: #d8faff; --steel: #8a8f9c; --red: #f87171; --green: #4ade80;
      --font-display: 'degular-display', 'degular', 'Sora', sans-serif;
      --font: 'degular', 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body { background: var(--bg); color: var(--ink); font-family: var(--font); min-height: 100vh; min-height: 100dvh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    img { display: block; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }

    /* fundo: brilho azul discreto, igual ao clima do hero */
    .glow { position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(60% 45% at 50% -8%, rgba(59,110,245,.28), transparent 70%), radial-gradient(40% 30% at 90% 110%, rgba(59,110,245,.12), transparent 70%); }

    /* ===== topo ===== */
    .top { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: rgba(0,0,0,.72); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-bottom: 1px solid var(--line); }
    .top img { height: 26px; width: auto; filter: drop-shadow(0 0 10px var(--accent-glow)); }
    .top-r { display: flex; align-items: center; gap: 14px; }
    .count { font: 500 12px var(--font-mono); color: var(--muted); letter-spacing: .04em; opacity: 0; transition: opacity .3s; }
    .count.on { opacity: 1; }
    .lang { font: 700 12px var(--font); color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 100px; padding: 7px 12px; }
    .bar { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--accent); box-shadow: 0 0 12px var(--accent-glow); transition: width .5s cubic-bezier(.2,.8,.3,1); }

    /* ===== palco ===== */
    main { position: relative; z-index: 1; width: 100%; max-width: 720px; margin: 0 auto; padding: 104px 20px 64px; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    .scr { display: none; flex-direction: column; flex: 1; }
    .scr.on { display: flex; animation: scrIn .5s cubic-bezier(.2,.8,.3,1) both; }
    @keyframes scrIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .kick { font: 600 12px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent-hi); }
    .h { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 8.4vw, 64px); line-height: .96; letter-spacing: -.025em; text-transform: uppercase; margin-top: 16px; }
    .h .blue, .qh .blue { font-family: var(--font-serif); font-style: italic; font-weight: 400; text-transform: none; letter-spacing: -.01em; font-size: 1.14em; line-height: 1; color: var(--ice); }
    .lead { margin-top: 22px; max-width: 44ch; font-size: clamp(16px, 4.2vw, 18px); line-height: 1.5; color: var(--ink-2); }
    .lead b { color: #fff; font-weight: 700; }

    /* botão no padrão do site */
    .cta { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 17px 32px; font: 700 16px var(--font); color: #fff; background: var(--accent); border-radius: 100px; text-decoration: none; box-shadow: 0 10px 36px var(--accent-glow), 0 0 0 1px rgba(255,255,255,.18) inset; transition: transform .15s cubic-bezier(.34,1.56,.64,1), background .25s, box-shadow .25s; }
    .cta:hover { background: #2554d6; transform: translateY(-2px); box-shadow: 0 16px 50px var(--accent-glow); }
    .cta:active { transform: translateY(3px) scale(.97); box-shadow: 0 2px 10px var(--accent-glow); }
    .cta .arr { width: 19px; height: 19px; background: rgba(255,255,255,.2); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
    .cta[disabled] { opacity: .35; pointer-events: none; }
    .cta.wide { width: 100%; }
    .ghost { margin-top: 18px; align-self: center; font-size: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
    .ghost:hover { color: #fff; }

    /* ===== intro ===== */
    .intro { justify-content: center; text-align: center; align-items: center; }
    .intro .lead { margin-left: auto; margin-right: auto; }
    .intro .cta { margin-top: 34px; }
    .apps { display: flex; gap: 8px; justify-content: center; margin-bottom: 26px; }
    .app { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font: 800 14px var(--font); }
    .app.pr { background: #00005b; color: #9999ff; box-shadow: inset 0 0 0 1.5px #9999ff; }
    .app.ae { background: #00005b; color: #d291ff; box-shadow: inset 0 0 0 1.5px #d291ff; }
    .app.dv { background: #14161a; box-shadow: inset 0 0 0 1px #2a2d33; }
    .app.dv i { width: 18px; height: 18px; display: block; border-radius: 50%; background: conic-gradient(#f2554a 0 33%, #4cc38a 0 66%, #3b9bf5 0); }
    .meta { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: 22px; font-size: 13px; color: var(--muted); }
    .meta span::before { content: '✓'; color: var(--accent-hi); margin-right: 6px; font-weight: 700; }

    /* ===== pergunta ===== */
    .qh { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 6.6vw, 46px); line-height: 1; letter-spacing: -.02em; text-transform: uppercase; margin-top: 14px; }
    .qs { margin-top: 12px; font-size: 15px; line-height: 1.45; color: var(--steel); }
    .opts { display: grid; gap: 10px; margin-top: 28px; }
    .opts.two { grid-template-columns: 1fr 1fr; }
    .opt { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 16px 18px; border-radius: 16px; background: rgba(255,255,255,.035); border: 1px solid var(--line-2); font: 600 16px/1.3 var(--font); color: #fff; transition: border-color .2s, background .2s, transform .15s; }
    .opt:hover { border-color: rgba(110,155,255,.55); background: rgba(59,110,245,.08); }
    .opt:active { transform: scale(.985); }
    .opt .ic { flex: none; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: rgba(255,255,255,.06); color: var(--accent-hi); }
    .opt .ic svg { width: 20px; height: 20px; }
    .opt .tk { flex: none; margin-left: auto; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; font-size: 12px; color: transparent; transition: all .2s; }
    .opt.multi .tk { border-radius: 6px; }
    .opt.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset, 0 10px 30px -14px var(--accent-glow); }
    .opt.sel .tk { background: var(--accent); border-color: var(--accent); color: #fff; }
    .opts.locked .opt:not(.sel) { opacity: .4; pointer-events: none; }
    .opts.two .opt { flex-direction: column; align-items: flex-start; gap: 12px; padding: 16px; }
    .opts.two .opt .tk { position: absolute; top: 14px; right: 14px; }

    /* inserção: o "estamos personalizando" */
    .ins { display: none; margin-top: 18px; padding: 16px 18px; border-radius: 16px; background: linear-gradient(180deg, rgba(59,110,245,.16), rgba(59,110,245,.06)); border: 1px solid rgba(110,155,255,.35); }
    .ins.on { display: block; animation: scrIn .45s cubic-bezier(.2,.8,.3,1) both; }
    .ins-t { display: flex; align-items: center; gap: 8px; font: 600 11px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent-hi); }
    .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
    .eq i { width: 3px; background: var(--accent-hi); border-radius: 1px; animation: eq .9s ease-in-out infinite; }
    .eq i:nth-child(2) { animation-delay: .15s; } .eq i:nth-child(3) { animation-delay: .3s; } .eq i:nth-child(4) { animation-delay: .45s; }
    @keyframes eq { 0%,100% { height: 3px; } 50% { height: 12px; } }
    .ins p { margin-top: 8px; font-size: 15.5px; line-height: 1.45; color: #e8ecf6; }
    .next { margin-top: 22px; }
    .back { align-self: flex-start; margin-bottom: 18px; font-size: 13px; color: var(--muted); }
    .back:hover { color: #fff; }

    /* ===== interlúdio e carregamento ===== */
    .mid, .load { justify-content: center; text-align: center; align-items: center; }
    .lockbox { margin: 30px auto 0; width: 100%; max-width: 420px; padding: 26px 22px; border-radius: 22px; border: 1px solid var(--line-2); background: rgba(255,255,255,.03); }
    .lockbox small { display: block; font: 600 11px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .blur { margin-top: 12px; font: 800 64px/1 var(--font-display); letter-spacing: -.03em; filter: blur(14px); user-select: none; }
    .lockbox p { margin-top: 14px; font-size: 14px; color: var(--steel); }
    .ring { width: 92px; height: 92px; margin: 0 auto 28px; position: relative; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 6; }
    .ring .bg { stroke: rgba(255,255,255,.08); }
    .ring .fg { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 264; stroke-dashoffset: 264; filter: drop-shadow(0 0 8px var(--accent-glow)); }
    .ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 20px var(--font-mono); }
    .steps { list-style: none; margin: 26px auto 0; max-width: 360px; text-align: left; display: grid; gap: 12px; }
    .steps li { display: flex; gap: 12px; align-items: center; font-size: 15px; color: var(--dim); transition: color .3s; }
    .steps li i { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--dim); display: grid; place-items: center; font-style: normal; font-size: 11px; color: transparent; transition: all .3s; }
    .steps li.go { color: var(--ink-2); }
    .steps li.ok { color: #fff; }
    .steps li.ok i { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ===== resultado ===== */
    .res { gap: 0; }
    .blk { margin-top: 56px; }
    .blk:first-child { margin-top: 0; }
    .card { border-radius: 22px; border: 1px solid var(--line-2); background: rgba(255,255,255,.03); padding: 24px 22px; }
    .prof { margin-top: 26px; }
    .prof-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .prof-row small { font: 600 11px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .prof-row b { font: 700 13px var(--font-mono); }
    .gauge { position: relative; margin-top: 14px; height: 10px; border-radius: 10px; background: linear-gradient(90deg, #4ade80, #facc15 50%, #f87171); }
    .gauge i { position: absolute; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px #000, 0 0 18px rgba(255,255,255,.6); left: 0; transition: left 1.4s cubic-bezier(.2,.8,.3,1); }
    .gauge-l { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: var(--muted); }
    .prof p { margin-top: 18px; font-size: 16px; line-height: 1.5; color: var(--ink-2); }
    .stat { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .stat .card { padding: 20px 18px; }
    .stat b { display: block; font: 800 clamp(40px, 11vw, 60px)/1 var(--font-display); letter-spacing: -.03em; color: #fff; }
    .stat b em { font-style: normal; font-size: .45em; color: var(--steel); margin-left: 4px; letter-spacing: 0; }
    .stat span { display: block; margin-top: 8px; font-size: 13.5px; line-height: 1.4; color: var(--steel); }
    .math { margin-top: 12px; font: 500 12px/1.5 var(--font-mono); color: var(--dim); }

    .sub { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 6vw, 40px); line-height: 1; letter-spacing: -.02em; text-transform: uppercase; }
    .sub .blue { font-family: var(--font-serif); font-style: italic; font-weight: 400; text-transform: none; font-size: 1.14em; color: var(--ice); }
    .fix { list-style: none; display: grid; gap: 10px; margin-top: 22px; }
    .fix li { border-radius: 18px; border: 1px solid var(--line-2); background: rgba(255,255,255,.03); padding: 18px 18px 18px; }
    .fix .pb { display: flex; gap: 10px; font-size: 15px; line-height: 1.4; color: var(--steel); }
    .fix .pb::before { content: '✕'; flex: none; color: var(--red); font-weight: 700; }
    .fix .sol { display: flex; gap: 10px; margin-top: 10px; font-size: 15.5px; line-height: 1.45; color: #fff; }
    .fix .sol::before { content: '✓'; flex: none; color: var(--accent-hi); font-weight: 800; }

    .kit { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
    .fold { position: relative; text-align: left; padding: 16px; border-radius: 18px; border: 1px solid var(--line-2); background: rgba(255,255,255,.03); overflow: hidden; transition: border-color .2s, transform .15s; }
    .fold::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); }
    .fold:hover { border-color: var(--c); }
    .fold:active { transform: scale(.98); }
    .fold-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .fold-h b { font: 700 15px var(--font); }
    .fold-h small { font: 500 11px var(--font-mono); color: var(--muted); }
    .wave { display: flex; align-items: center; gap: 1.5px; height: 34px; margin-top: 14px; }
    .wave i { flex: 1; min-height: 2px; border-radius: 1px; background: var(--c); opacity: .45; transition: opacity .1s; }
    .wave i.p { opacity: 1; }
    .fold-n { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12.5px; color: var(--steel); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fold-n em { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: #000; display: grid; place-items: center; font-style: normal; font-size: 9px; }
    .hint { margin-top: 12px; font-size: 13px; color: var(--muted); text-align: center; }

    .vid { margin-top: 22px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line-2); background: #0a0a0c; aspect-ratio: 1280 / 818; }
    .vid video { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* depoimentos (mesmo visual do WhatsApp da página) */
    .wa-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; align-items: start; }
    .wa { margin: 0; border-radius: 20px; overflow: hidden; background: #0b141a; box-shadow: 0 0 0 1px rgba(255,255,255,.06); }
    .wa-top { display: flex; align-items: center; gap: 10px; padding: 11px 13px; background: #1f2c34; }
    .wa-av { width: 32px; height: 32px; border-radius: 50%; flex: none; overflow: hidden; background: radial-gradient(circle at 50% 38%, #8696a0 0 26%, transparent 27%), radial-gradient(ellipse 60% 44% at 50% 100%, #8696a0 0 60%, transparent 61%), #2a3942; }
    .wa-av img { width: 100%; height: 100%; object-fit: cover; }
    .wa-who { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
    .wa-who b { font: 600 13px var(--font); color: #e9edef; }
    .wa-who i { font: 400 11px var(--font); color: #8696a0; font-style: normal; }
    .wa-body { display: flex; flex-direction: column; gap: 4px; padding: 12px 10px 14px; background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1.2px); background-size: 14px 14px; }
    .wa-m { max-width: 90%; padding: 6px 9px 7px; border-radius: 9px; font: 400 13.5px/1.32 var(--font); color: #e9edef; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 2px 10px; }
    .wa-m.in { align-self: flex-start; background: #202c33; border-top-left-radius: 3px; }
    .wa-m.out { align-self: flex-end; background: #005c4b; border-top-right-radius: 3px; }
    .wa-m time { margin-left: auto; font: 400 10px var(--font); color: rgba(233,237,239,.55); }
    .wa-m.hl span { background: linear-gradient(transparent 58%, rgba(255,196,0,.32) 58%); }
    .wa-note { margin-top: 12px; font-size: 12px; color: var(--dim); text-align: center; }

    /* oferta */
    .offer { position: relative; margin-top: 22px; padding: 30px 24px 26px; border-radius: 26px; text-align: center; background: radial-gradient(80% 60% at 50% 0%, rgba(59,110,245,.22), transparent 70%), #07080b; border: 1px solid rgba(110,155,255,.35); box-shadow: 0 30px 80px -40px var(--accent-glow); }
    .offer img { height: 34px; width: auto; margin: 0 auto; filter: drop-shadow(0 0 12px var(--accent-glow)); }
    .echo { margin: 18px auto 0; max-width: 34ch; font-family: var(--font-serif); font-style: italic; font-size: 22px; line-height: 1.2; color: var(--ice); }
    .inc { list-style: none; margin: 22px auto 0; max-width: 360px; text-align: left; display: grid; gap: 10px; }
    .inc li { display: flex; gap: 10px; font-size: 15px; line-height: 1.4; color: var(--ink-2); }
    .inc li::before { content: '✓'; flex: none; color: var(--accent-hi); font-weight: 800; }
    .price { margin-top: 26px; }
    .price b { font: 800 clamp(52px, 14vw, 68px)/1 var(--font-display); letter-spacing: -.03em; }
    .price span { display: block; margin-top: 8px; font-size: 14px; color: var(--steel); }
    .offer .cta { margin-top: 22px; }
    .secure { margin-top: 14px; font-size: 12.5px; color: var(--muted); }
    .guar { display: flex; gap: 14px; align-items: flex-start; text-align: left; margin-top: 14px; padding: 18px; border-radius: 18px; border: 1px solid var(--line-2); background: rgba(255,255,255,.03); }
    .guar em { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-hi); font: 800 15px var(--font-mono); font-style: normal; }
    .guar b { display: block; font-size: 15px; }
    .guar p { margin-top: 4px; font-size: 14px; line-height: 1.45; color: var(--steel); }
    .orig { position: relative; margin-top: 44px; padding: 26px 22px; border-radius: 22px; text-align: center; overflow: hidden; border: 1px solid var(--line-2); background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.92)), url('/assets/hero-poster.jpg') center / cover no-repeat; }
    .orig small { display: block; font: 600 11px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent-hi); }

        opts.querySelectorAll('.opt').forEach(function (o) { o.classList.toggle('sel', arr.indexOf(o.getAttribute('data-v')) > -1); });
        next.disabled = !arr.length;
        if (arr.length) insight(); else ins.classList.remove('on');
      } else {
        A[q.id] = v;
        opts.querySelectorAll('.opt').forEach(function (o) { o.classList.toggle('sel', o === b); });
        insight();
        next.style.display = ''; next.disabled = false;
        setTimeout(function () { next.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 120);
      }
    });
    next.onclick = function () {
      track('answer', q.id, Array.isArray(A[q.id]) ? A[q.id].join(',') : A[q.id]);
      if (q.mid) return mid();
      if (i + 1 < Q.length) ask(i + 1); else load();
    };
    var back = s.querySelector('#back');
    if (back) back.onclick = function () { ask(i - 1); };
  }

  function calc() {
    var m = MIN[A.time] || 10, v = VOL[A.vol] || 4;
    var hm = m * v * 4.3 / 60, hy = hm * 12;
    var pains = (A.pains || []).filter(function (x) { return x !== 'none'; });
    var score = ({ a: 10, b: 30, c: 52, d: 70 })[A.time] || 30;
    score += ({ yt: 16, envato: 10, folder: 12, none: 20 })[A.source] || 10;
    score += Math.min(18, pains.length * 6);
    score = Math.max(6, Math.min(96, score));
    A._score = score; A._hy = Math.round(hy);
    return { m: m, v: v, hm: hm, hy: hy, days: hy / 8, pains: pains, score: score, level: score >= 62 ? 'high' : score >= 35 ? 'mid' : 'low' };
  }
  function fmt(n, d) {
    var s = n.toFixed(d || 0);
    return lang === 'pt' ? s.replace('.', ',') : s;
  }

  function mid() {
    idx = 7; setTop(7);
    var s = show(
      '<p class="kick">' + t('mid.k') + '</p>' +
      '<h2 class="h">' + t('mid.h') + '</h2>' +
      '<p class="lead">' + t('mid.p') + '</p>' +
      '<div class="lockbox"><small>' + t('mid.l') + '</small><div class="blur">' + Math.round(calc().hy) + 'h</div><p>🔒 ' + t('mid.n') + '</p></div>' +
      '<button class="cta" id="go" type="button" style="margin-top:28px">' + t('mid.cta') + ' <span class="arr">→</span></button>', 'mid');
    track('view', 'mid');
    s.querySelector('#go').onclick = function () { ask(7); };
  }

  function load() {
    idx = Q.length; setTop(Q.length);
    var steps = ['load.1', 'load.2', 'load.3', 'load.4'];
    var s = show(
      '<div class="ring"><svg viewBox="0 0 92 92"><circle class="bg" cx="46" cy="46" r="42"/><circle class="fg" id="fg" cx="46" cy="46" r="42"/></svg><b id="pct">0%</b></div>' +
      '<h2 class="sub">' + t('load.t') + '</h2>' +
      '<ul class="steps">' + steps.map(function (k) { return '<li><i>✓</i>' + t(k, { app: appName() }) + '</li>'; }).join('') + '</ul>', 'load');
    var fg = s.querySelector('#fg'), pct = s.querySelector('#pct'), li = s.querySelectorAll('.steps li');
    var dur = 4200, st = performance.now();
    (function tick(now) {
      var p = Math.min(1, (now - st) / dur);
      var e = 1 - Math.pow(1 - p, 2);
      fg.style.strokeDashoffset = 264 * (1 - e);
      pct.textContent = Math.round(e * 100) + '%';
      li.forEach(function (l, k) { var a = k / li.length, b = (k + 1) / li.length; l.classList.toggle('go', e >= a); l.classList.toggle('ok', e >= b * .98); });
      if (p < 1) requestAnimationFrame(tick); else setTimeout(result, 450);
    })(st);
    LIB();
  }

  // biblioteca real (nomes, ondas e arquivos de amostra)
  var lib = null, libP = null;
  function LIB() {
    if (!libP) libP = fetch('/assets/sim/lib.json').then(function (r) { return r.json(); }).then(function (d) { lib = d; return d; }).catch(function () { return null; });
    return libP;
  }

  var au = null, playing = null;
  function playCat(card, cat) {
    if (!lib) return;
    var list = lib.sounds.filter(function (x) { return x.cat === cat; });
    var cur = +(card.getAttribute('data-i') || -1);
    var snd = list[(cur + 1) % list.length];
    card.setAttribute('data-i', (cur + 1) % list.length);
    card.querySelector('.fold-n span').textContent = snd.name;
    var wv = card.querySelector('.wave');
    wv.innerHTML = snd.w.filter(function (_, k) { return k % 2 === 0; }).map(function (h) { return '<i style="height:' + Math.max(6, h) + '%"></i>'; }).join('');
    au = au || new Audio();
    au.pause(); au.src = '/assets/sim/s/' + snd.id + '.mp3'; au.currentTime = 0;
    au.play().catch(function () {});
    if (playing) playing.classList.remove('on');
    playing = card;
    var bars = wv.querySelectorAll('i');
    au.ontimeupdate = function () {
      var p = au.duration ? au.currentTime / au.duration : 0;
      bars.forEach(function (b, k) { b.classList.toggle('p', k / bars.length <= p); });
    };
    track('play', cat, snd.id);
  }

  function result() {
    var r = calc();
    setTop(null); bar.style.width = '100%';
    var pains = [A.source].concat(r.pains).filter(Boolean);
    var type = A.type || 'youtube';
    var kit = KIT[type] || KIT.youtube;
    var catInfo = {};
    if (lib) lib.cats.forEach(function (c) { catInfo[c.id] = c; });
    var commit = A.commit || 'see';

    var html =
      '<div class="blk">' +
        '<p class="kick">' + t('r.k') + '</p>' +
        '<h1 class="h">' + t('r.h.' + r.level) + '</h1>' +
        '<div class="card prof">' +
          '<div class="prof-row"><small>' + t('r.score') + '</small><b>' + r.score + '/100 ' + t('r.' + r.level) + '</b></div>' +
          '<div class="gauge"><i id="gi"></i></div>' +
          '<div class="gauge-l"><span>' + t('r.low') + '</span><span>' + t('r.mid') + '</span><span>' + t('r.high') + '</span></div>' +
          '<p>' + t('r.p.' + r.level) + '</p>' +
        '</div>' +
        '<div class="stat">' +
          '<div class="card"><b data-n="' + r.hm.toFixed(1) + '" data-d="1">0</b><span><strong style="color:#fff">' + t('r.hm') + '</strong><br>' + t('r.hm.s') + '</span></div>' +
          '<div class="card"><b data-n="' + r.days.toFixed(1) + '" data-d="1">0</b><span><strong style="color:#fff">' + t('r.dy') + '</strong><br>' + t('r.dy.s', { h: Math.round(r.hy) }) + '</span></div>' +
        '</div>' +
        '<p class="math">' + t('r.math', { m: r.m, v: fmt(r.v, r.v % 1 ? 1 : 0) }) + '</p>' +
      '</div>' +

      '<div class="blk">' +
        '<h2 class="sub">' + t('r.fix.h') + '</h2>' +
        '<ul class="fix">' + pains.map(function (p) { return '<li><div class="pb">' + t('pb.' + p) + '</div><div class="sol">' + t('fx.' + p) + '</div></li>'; }).join('') + '</ul>' +
      '</div>' +

      '<div class="blk">' +
        '<h2 class="sub">' + t('r.kit.h', { type: t('type.' + type) }) + '</h2>' +
        '<div class="kit">' + kit.map(function (c) {
          var info = catInfo[c] || { name: c, color: '#3b6ef5', count: '' };
          return '<button type="button" class="fold" data-cat="' + c + '" style="--c:' + info.color + '"><div class="fold-h"><b>' + info.name + '</b><small>' + info.count + '</small></div><div class="wave">' + Array(32).join('<i style="height:18%"></i>') + '</div><div class="fold-n"><em>' + ic('play').replace('stroke="currentColor"', 'fill="currentColor" stroke="none"').replace('<svg', '<svg width="9" height="9"') + '</em><span>' + (lang === 'pt' ? 'Toque pra ouvir' : 'Tap to listen') + '</span></div></button>';
        }).join('') + '</div>' +
        '<p class="hint">' + t('r.kit.hint') + '</p>' +
      '</div>' +

      '<div class="blk">' +
        '<h2 class="sub">' + t('r.vid.h', { app: appName() }) + '</h2>' +
        '<div class="vid"><video src="/assets/clips/pastas.mp4" poster="/assets/clips/pastas.jpg" autoplay muted loop playsinline preload="metadata"></video></div>' +
      '</div>' +

      '<div class="blk">' +
        '<h2 class="sub">' + t('r.tm.h') + '</h2>' +
        '<div class="wa-row">' +
          '<figure class="wa"><div class="wa-top"><span class="wa-av"></span><span class="wa-who"><b>' + t('tm.client') + '</b><i>' + (lang === 'pt' ? 'Turquia' : 'Turkey') + '</i></span></div><div class="wa-body"><div class="wa-m in"><span>Isn\'t this a one time payment?</span><time>16:11</time></div><div class="wa-m out"><span>Yes</span><time>16:12</time></div><div class="wa-m in hl"><span>I really liked it; great job.</span><time>16:15</time></div></div></figure>' +
          '<figure class="wa"><div class="wa-top"><span class="wa-av"><img src="/assets/tm-sorocaba.webp" alt="" loading="lazy"></span><span class="wa-who"><b>' + t('tm.client') + '</b><i>Sorocaba, SP</i></span></div><div class="wa-body"><div class="wa-m in"><span>Rapaz, bora lá falar do plugin</span><time>11:40</time></div><div class="wa-m in hl"><span>Eu tenho curtido muito</span><time>11:40</time></div><div class="wa-m in hl"><span>salvou demais</span><time>11:40</time></div></div></figure>' +
        '</div>' +
        '<p class="wa-note">' + t('tm.note') + '</p>' +
      '</div>' +

      '<div class="blk" id="offer">' +
        '<div class="offer">' +
          '<img src="/assets/logo.png" alt="dropSFX">' +
          '<p class="echo">' + t('echo.' + commit) + '</p>' +
          '<ul class="inc"><li>' + t('o.i1') + '</li><li>' + t('o.i2') + '</li><li>' + t('o.i3') + '</li><li>' + t('o.i4') + '</li><li>' + t('o.i5') + '</li></ul>' +
          '<div class="price"><b>US$ 30</b><span>' + t('o.price') + '</span></div>' +
          '<a class="cta wide js-buy" data-pos="quiz_offer" href="' + CHECKOUT + '" target="_blank" rel="noopener">' + t('o.cta') + ' <span class="arr">→</span></a>' +
          '<p class="secure">🔒 ' + t('o.secure') + '</p>' +
        '</div>' +
        '<div class="guar"><em>7</em><div><b>' + t('g.t') + '</b><p>' + t('g.p') + '</p></div></div>' +
        '<div class="orig"><small>' + t('orig.k') + '</small><p>' + t('orig.p') + '</p><a class="btn-orig" id="toHome" href="' + homeUrl() + '">' + t('full') + ' <span class="arr">→</span></a></div>' +
      '</div>';

    var s = show(html, 'res');
    s.style.paddingBottom = '70px';

    // gauge e números sobem
    requestAnimationFrame(function () { setTimeout(function () { var g = s.querySelector('#gi'); if (g) g.style.left = r.score + '%'; }, 150); });
    s.querySelectorAll('[data-n]').forEach(function (el) {
      var to = +el.getAttribute('data-n'), d = +el.getAttribute('data-d'), st = performance.now();
      (function tk(now) { var p = Math.min(1, (now - st) / 1300), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(to * e, d); if (p < 1) requestAnimationFrame(tk); })(st);
    });

    function bindKit() {
      s.querySelectorAll('.fold').forEach(function (f) {
        var c = f.getAttribute('data-cat');
        if (lib) { var info = lib.cats.filter(function (x) { return x.id === c; })[0]; if (info) { f.style.setProperty('--c', info.color); f.querySelector('.fold-h b').textContent = info.name; f.querySelector('.fold-h small').textContent = info.count; } }
        f.onclick = function () { LIB().then(function () { playCat(f, c); }); };
      });
    }
    bindKit(); if (!lib) LIB().then(bindKit);
    s.querySelector('#toHome').addEventListener('click', function () { track('home', 'result', null, true); });

    // barra fixa aparece depois do diagnóstico, some quando a oferta está na tela
    var stick = document.getElementById('stick'), offer = s.querySelector('#offer');
    wireBuy(stick);
    function onScroll() {
      var past = window.scrollY > 500;
      var ob = offer.getBoundingClientRect(), vis = ob.top < innerHeight && ob.bottom > 0;
      stick.classList.toggle('on', past && !vis);
    }
    window.addEventListener('scroll', onScroll, { passive: true }); onScroll();

    track('result', r.level, { score: r.score, hy: Math.round(r.hy), type: type, app: A.app, source: A.source, commit: commit }, true);
    window.dropsfxEvent('QuizComplete', { level: r.level, score: r.score, edit_type: type, app: A.app, commit: commit }, true);
    window.dropsfxEvent('ViewContent', { content_name: 'quiz_result', content_ids: ['dropsfx'], content_type: 'product', value: PRICE, currency: CURRENCY });
  }

  // =====================================================================
  // INÍCIO
  // =====================================================================
  function applyStatic() {
    document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
    document.getElementById('langBtn').textContent = lang === 'pt' ? 'EN' : 'PT';
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t(el.getAttribute('data-t')); });
    wireBuy(document);
  }
  document.getElementById('langBtn').onclick = function () {
    lang = lang === 'pt' ? 'en' : 'pt';
    try { localStorage.setItem('dropsfx_lang', lang); } catch (e) {}
    applyStatic();
    if (idx < 0) intro(); else if (idx < Q.length) ask(idx); else if (app.querySelector('.res')) result();
  };
  applyStatic();
  intro();
  track('view', 'intro');
})();
</script>
</body>
</html>
